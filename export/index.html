‌های مختلف\u003c/div>\u003cdiv class=\"callout-fold is-collapsed\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-chevron-down\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\" style=\"display: none;\">\n\u003cp dir=\"auto\">ص ۱۹۴\u003c/p>\n\u003c/div>\u003c/div>\n\u003cp dir=\"auto\">\u003ca class=\"tag\" href=\"#کمونیسم\" target=\"_blank\" rel=\"noopener nofollow\">#کمونیسم\u003c/a> \u003c/p>","rawMarkdown":"---\nauthor:\n  - \"[[رضا امیرخانی]]\"\npages: 244\nrating: 5\nstatus: 🟩 Done\ndate: 2024-02-07T00:00:00.000Z\ncover: \"[[nym-dang-pywng-yang.webp]]\"\ntags:\n  - book\nlink:\n  - https://www.goodreads.com/book/show/52120442\nbadge:\n  - 🪶خوش‌خوان\ncover_source: https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1588848644i/52120442.jpg\nlanguage: fa\n---\n# نقل قول ها\n\n> [!quote]-  چرا پیشرفت نظامی باعث پیشرفت غیرنظامی نشده؟\n> ص ۱۲۵\n\n> [!quote]-   تاثیر تحریم یا سیطره ایالات متحده روی ایران\n> ص ۱۳۵\n\n> [!quote]-  واقعیت مذاکره\n> ص ۱۷۶\n\n> [!quote]-  تغییر جنس سوال در دهه‌های مختلف\n> ص ۱۹۴\n> \n\n\n\n#کمونیسم \n"},{"id":"notes/جنایت و مکافات.md","title":"جنایت و مکافات","path":"notes/جنایت و مکافات.md","folder":"notes","ext":"md","ctime":1795633987940,"mtime":1795552117491,"size":7916,"links":[],"tags":["book"],"properties":{"author":"فئودور داستایفسکی","translator":"اصغر رستگار","pages":711,"rating":5,"date":"2026-01-23T00:00:00.000Z","status":"🟩 Done","cover":"[[jnayt-w-mkafat.webp]]","tags":["book"],"badge":["🧲گیرا","🪶خوش‌خوان"],"genre":null,"cover_source":"https://img.taaghche.com/frontCover/5151.jpg","type":"Novel","language":"fa"},"computedFormulas":{"starRating":"★★★★★","Untitled":""},"coverImage":"assets/images/jnayt-w-mkafat-9uzb0x.webp","coverAssetRelativePath":"assets/images/jnayt-w-mkafat-9uzb0x.webp","htmlContent":"\u003ch1 data-heading=\"نشانه\" dir=\"auto\">نشانه\u003c/h1>\n\u003cdiv class=\"callout node-insert-event\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg width=\"16\" height=\"16\">\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">منافع شخصی، نصف کردن کت\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">نه، قربان، اينها شعار نيست! در گذشته اگر مثلا به من مى گفتند: همسايه خود را چون خود دوست بدار!» ومن دوست مى داشتم، نتيجه اش چى مى شد؟» وفى الفور، با شتابى بى مورد، ادامه داد: «نتيجه اش اين مى شد كه كتِ تنم را دربياورم، از وسط دو نصف كنم ونصفش را بدهم به همسايه ام، ودر نتيجه هردومان عریان بمانيم. به قولِ ضرب المثلِ خودمان: «کسی که دنبالِ دو تا خرگوش بدود، به هيج كدام نمى رسد.» اما علم به ما مى گويد: «نخير، اول خودت را دوست بدار، بعد برو سراغِ ديگران، چون بايه واساس همه جيز نفع شخصى است. اگر فقط خودت را دوست داشته باشى، كارت را همان جور انجام مى دهى كه بايد انجام بدهى، بلايى هم سر كتت نمى آيد. اين هم يک اصل اقتصادى است كه هر جه كسب وكار خصوصی رونقٍ بيشترى داشته باشد ومثلا كتِ آدم سالم تر باشد، مبانى زندكى اجتماعى محكم تر مى شود ورفاهِ عمومى گسترش بيشترى پيدا مى كند. واين معنايش اين است كه من فقط وفقط بايد\u003cbr>\nبه فكر منافعٍ خودم باشم؛ به عبارت ديگر، وقتى من فقط به فكر منافع خودم بودم وبراى خودم كسب ثروت كردم، خودبه خود منافع همه تأمين مى شود وآن وقت همسايه من هم چيزى بيشتراز نصفه كتِ باره من گیرش مى آيد، آن هم نه از راهِ خيرات وصدقه يک عدهِ معدود، بلكه در نتيجه بالا رفتنِ سطحِ زندكَى عموم مردم. اين يک فكر بسيار بسيار ساده وابتدايى است، منتها متأسفانه از قديم ونديم قبولش نكرده اند وسعى كردهاند با احساسات بازى ودرويش مسلكى خفه اش كنند، در حالى كه درگ آن هوش ودرايت زبادى نمى خواهد.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"callout node-insert-event\" data-callout=\"note\" data-callout-fold=\"\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg width=\"16\" height=\"16\">\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">خودشیفتگی پیوتر پتروویچ\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\">\n\u003cp dir=\"auto\">پیوتر پتروویچ از نوکیسه های تازه به دوران رسيده بود وبه شكل علاج ناپذيرى شيفته سجاياى خود. عقل ودرايتِ خود را سخت بزرگ مى كرد، حتى گاهى كه تنها بود، ساعتها جلو آينه مى ايستاد وبه چشم تحسين به خودش نكاه مى كرد. اما پول را بيشتر از هرچيزى دوست مى داشت، پولى كه با مشقت ومرارت، سكه سكه جمع كرده بود: پول به او شأن وشوكتى بالاتر از آنجه بود مى بخشيد.\u003cbr>\n...با اين همه، فكر مى كرد شق القمر كرده است كه دونيا را هم شأن خود دانسته و با خود دريک رديف قرار داده است. اين را كه مى گفت، در واقع، فكرى را به زبان مى آورد كه در كنه ضمیرش پرورانده بود و بارها در دهان مزه مزه كرده بود. اين بود كه نمى توانست بفهمد كه چرا ديكران با او همفكر نيستند. ديروز هم که به دیدنِ راسکولنيكف رفته بود، با حال وهوای ولی نعمتِ نیکوکاری وارد اتاقٍ او شده بود كه آمده است تا اجر عمل خيرش را بگيرد وبه تعريف وتمجيدهاى تملق آميز گوش بدهد. اين بود كه وقتى از پله ها بايين مى رفت، فكر مى كرد دستش نمک ندارد و حقش پايمال شده است.\u003c/p>\n\u003c/div>\u003c/div>\n\u003ch2 data-heading=\"جمله برداری\" dir=\"auto\">جمله برداری\u003c/h2>\n\u003cul>\n\u003cli dir=\"auto\">\n\u003cp>قلبش گروپ گروپ می‌زد و افکار چون گردباد در سرش می‌چرخید. چشم ها و افکارش فضای بیشتری می طلبید.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>با این سوال های پی در پی همین طور خودش را میخورد و عذاب می داد تا جایی که انگار از این کار لذت می برد. با این حال هیچ یک از این سوال ها برایش تازگی نداشت.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>با وجود این، به نظر می آمد تجزیه و تحلیل کلی قضیه را از لحاظ حلی معضل اخلاقی مسئله مدتی پیش تمام کرده بود. منطق اخلاقی اش \u003cstrong>به تیزی تیغ شده بود\u003c/strong>، و از هر زاویه ای که نگاه میکرد هیچ ایراد وجدانی به نقشه هایش وارد نمی دید.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>این فعالیت ها به دود می مانند، به مه، به آوای کم جان نغمه‌ای در فضای مه‌آلود. مقاله تو یک مشت مهملات موهوم و توخالی بود، ولی هز هر سطرش نسیم صداقت و خلوص نیست می‌وزید، در سطر سطرش غروب شاداب و فسادناپذیر موج می‌زد. بوی تهوری ناشی از یأس و سرخوردگی می‌داد.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>سرِ رشته خیال را به دست گرفت | رشته خیال از دستش درنرود.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>انگار با هذیانی که رفته رفته همه وجودش را تسخیر می کرد گلاویز شده بود.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>فکر دیگری هم بود که بی وفقه به مغزش هجوم می‌آورد و آزارش می‌داد، هرچند که از بس دردناک بود سعی می‌کرد از ذهن خود بتاراند.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch1 data-heading=\"حاشیه\" dir=\"auto\">حاشیه\u003c/h1>\n\u003cp dir=\"auto\">کتاب خوبی بود. ترجمه روان و خودمونیه رستگار باعث شده بود که این حجم رو بتونم به راحتی بخونم و لذت ببرم.\u003cbr>\nیک چیزی که مدام فکرم رو درگیر میکرد این بود که نویسنده های داستان های بلند چه قدر باید ذهنشون قوی باشه و حافظه خوبی داشته باشند تا بتونند این قدر داستان رو گسترش بدن. ظرافت خاصی میخواد. من یه جاهایی فراموش میکردم چند روز گذشته و قبلا چه اتفاقاتی افتاده. شخصیت ها وقتی زیاد میشد با اون اسم های نامنوسشون قاطی میکردم.\u003cbr>\nمثلا دایی جان ناپلئون برای هرکسی یه تیکه کلامی یه رفتاری گذاشته بود که توی ذهنت حک میشد. دروغ چرا تا قبرآآآآ، مومنت مومنت اصلا اسم نمیخواد.\u003cbr>\nتوقع داشتم پایانش بیشتر باشه. اینکه از افکار راسکلنیکف توی این دوران بیشتر بگه.\u003cbr>\nیه مقدار زیادی مفصل شده بود اما داستایفسکی اینقدر ظریف و هنرمندانه این ها رو نوشته بود که دل زده و کسل نشدم.\u003cbr>\nبعضی جاها واقعا نگران میشدم. اون مکالمه ها با پوفیری یه جاهایی منم دستپاچه میشدم سرم گیج میرفتم احساس خطر میکردم. با راسکلنیکف یکی میشدم. نکنه الان مچم رو بگیره.\u003c/p>\n\u003cp dir=\"auto\">ترجمه چه قدر خوب بود. چه قدر کلمه برداری کردم. چه قدر روان و خودمونی بود. \u003c/p>","rawMarkdown":"---\nauthor: فئودور داستایفسکی\ntranslator: اصغر رستگار\npages: 711\nrating: 5\ndate: 2026-01-23T00:00:00.000Z\nstatus: 🟩 Done\ncover: \"[[jnayt-w-mkafat.webp]]\"\ntags:\n  - book\nbadge:\n  - 🧲گیرا\n  - 🪶خوش‌خوان\ngenre:\ncover_source: https://img.taaghche.com/frontCover/5151.jpg\ntype: Novel\nlanguage: fa\n---\n\n\n\n# نشانه\n\n> [!NOTE] منافع شخصی، نصف کردن کت\n> نه، قربان، اينها شعار نيست! در گذشته اگر مثلا به من مى گفتند: همسايه خود را چون خود دوست بدار!» ومن دوست مى داشتم، نتيجه اش چى مى شد؟» وفى الفور، با شتابى بى مورد، ادامه داد: «نتيجه اش اين مى شد كه كتِ تنم را دربياورم، از وسط دو نصف كنم ونصفش را بدهم به همسايه ام، ودر نتيجه هردومان عریان بمانيم. به قولِ ضرب المثلِ خودمان: «کسی که دنبالِ دو تا خرگوش بدود، به هيج كدام نمى رسد.» اما علم به ما مى گويد: «نخير، اول خودت را دوست بدار، بعد برو سراغِ ديگران، چون بايه واساس همه جيز نفع شخصى است. اگر فقط خودت را دوست داشته باشى، كارت را همان جور انجام مى دهى كه بايد انجام بدهى، بلايى هم سر كتت نمى آيد. اين هم يک اصل اقتصادى است كه هر جه كسب وكار خصوصی رونقٍ بيشترى داشته باشد ومثلا كتِ آدم سالم تر باشد، مبانى زندكى اجتماعى محكم تر مى شود ورفاهِ عمومى گسترش بيشترى پيدا مى كند. واين معنايش اين است كه من فقط وفقط بايد\n> به فكر منافعٍ خودم باشم؛ به عبارت ديگر، وقتى من فقط به فكر منافع خودم بودم وبراى خودم كسب ثروت كردم، خودبه خود منافع همه تأمين مى شود وآن وقت همسايه من هم چيزى بيشتراز نصفه كتِ باره من گیرش مى آيد، آن هم نه از راهِ خيرات وصدقه يک عدهِ معدود، بلكه در نتيجه بالا رفتنِ سطحِ زندكَى عموم مردم. اين يک فكر بسيار بسيار ساده وابتدايى است، منتها متأسفانه از قديم ونديم قبولش نكرده اند وسعى كردهاند با احساسات بازى ودرويش مسلكى خفه اش كنند، در حالى كه درگ آن هوش ودرايت زبادى نمى خواهد.\n\n\n> [!NOTE] خودشیفتگی پیوتر پتروویچ\n> پیوتر پتروویچ از نوکیسه های تازه به دوران رسيده بود وبه شكل علاج ناپذيرى شيفته سجاياى خود. عقل ودرايتِ خود را سخت بزرگ مى كرد، حتى گاهى كه تنها بود، ساعتها جلو آينه مى ايستاد وبه چشم تحسين به خودش نكاه مى كرد. اما پول را بيشتر از هرچيزى دوست مى داشت، پولى كه با مشقت ومرارت، سكه سكه جمع كرده بود: پول به او شأن وشوكتى بالاتر از آنجه بود مى بخشيد.\n> ...با اين همه، فكر مى كرد شق القمر كرده است كه دونيا را هم شأن خود دانسته و با خود دريک رديف قرار داده است. اين را كه مى گفت، در واقع، فكرى را به زبان مى آورد كه در كنه ضمیرش پرورانده بود و بارها در دهان مزه مزه كرده بود. اين بود كه نمى توانست بفهمد كه چرا ديكران با او همفكر نيستند. ديروز هم که به دیدنِ راسکولنيكف رفته بود، با حال وهوای ولی نعمتِ نیکوکاری وارد اتاقٍ او شده بود كه آمده است تا اجر عمل خيرش را بگيرد وبه تعريف وتمجيدهاى تملق آميز گوش بدهد. اين بود كه وقتى از پله ها بايين مى رفت، فكر مى كرد دستش نمک ندارد و حقش پايمال شده است.\n\n\n## جمله برداری\n- قلبش گروپ گروپ می‌زد و افکار چون گردباد در سرش می‌چرخید. چشم ها و افکارش فضای بیشتری می طلبید.\n- با این سوال های پی در پی همین طور خودش را میخورد و عذاب می داد تا جایی که انگار از این کار لذت می برد. با این حال هیچ یک از این سوال ها برایش تازگی نداشت.\n- با وجود این، به نظر می آمد تجزیه و تحلیل کلی قضیه را از لحاظ حلی معضل اخلاقی مسئله مدتی پیش تمام کرده بود. منطق اخلاقی اش **به تیزی تیغ شده بود**، و از هر زاویه ای که نگاه میکرد هیچ ایراد وجدانی به نقشه هایش وارد نمی دید.\n- این فعالیت ها به دود می مانند، به مه، به آوای کم جان نغمه‌ای در فضای مه‌آلود. مقاله تو یک مشت مهملات موهوم و توخالی بود، ولی هز هر سطرش نسیم صداقت و خلوص نیست می‌وزید، در سطر سطرش غروب شاداب و فسادناپذیر موج می‌زد. بوی تهوری ناشی از یأس و سرخوردگی می‌داد.\n\n- سرِ رشته خیال را به دست گرفت | رشته خیال از دستش درنرود.\n- انگار با هذیانی که رفته رفته همه وجودش را تسخیر می کرد گلاویز شده بود.\n- فکر دیگری هم بود که بی وفقه به مغزش هجوم می‌آورد و آزارش می‌داد، هرچند که از بس دردناک بود سعی می‌کرد از ذهن خود بتاراند.\n\n# حاشیه\n\n\n\n\nکتاب خوبی بود. ترجمه روان و خودمونیه رستگار باعث شده بود که این حجم رو بتونم به راحتی بخونم و لذت ببرم. \nیک چیزی که مدام فکرم رو درگیر میکرد این بود که نویسنده های داستان های بلند چه قدر باید ذهنشون قوی باشه و حافظه خوبی داشته باشند تا بتونند این قدر داستان رو گسترش بدن. ظرافت خاصی میخواد. من یه جاهایی فراموش میکردم چند روز گذشته و قبلا چه اتفاقاتی افتاده. شخصیت ها وقتی زیاد میشد با اون اسم های نامنوسشون قاطی میکردم.\nمثلا دایی جان ناپلئون برای هرکسی یه تیکه کلامی یه رفتاری گذاشته بود که توی ذهنت حک میشد. دروغ چرا تا قبرآآآآ، مومنت مومنت اصلا اسم نمیخواد.\nتوقع داشتم پایانش بیشتر باشه. اینکه از افکار راسکلنیکف توی این دوران بیشتر بگه.\nیه مقدار زیادی مفصل شده بود اما داستایفسکی اینقدر ظریف و هنرمندانه این ها رو نوشته بود که دل زده و کسل نشدم. \nبعضی جاها واقعا نگران میشدم. اون مکالمه ها با پوفیری یه جاهایی منم دستپاچه میشدم سرم گیج میرفتم احساس خطر میکردم. با راسکلنیکف یکی میشدم. نکنه الان مچم رو بگیره.\n\nترجمه چه قدر خوب بود. چه قدر کلمه برداری کردم. چه قدر روان و خودمونی بود. \n"},{"id":"notes/The Sketchnote Handbook.md","title":"The Sketchnote Handbook","path":"notes/The Sketchnote Handbook.md","folder":"notes","ext":"md","ctime":1795633696587,"mtime":1795633696587,"size":382,"links":[],"tags":["book"],"properties":{"author":["Mike Rohde"],"pages":224,"rating":4,"date":"2024-08-15","status":"🟩 Done","cover":"[[sketchnote-handbook.webp]]","tags":["book"],"aliases":["کتاب راهنمای اسکچ نوت"],"badge":["🦉آموزنده"],"cover_source":"https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1354312096i/15858089.jpg","language":"en"},"computedFormulas":{"starRating":"★★★★","Untitled":""},"coverImage":"assets/images/sketchnote-handbook-ygctp7.webp","coverAssetRelativePath":"assets/images/sketchnote-handbook-ygctp7.webp","htmlContent":"","rawMarkdown":"---\r\nauthor:\r\n  - Mike Rohde\r\npages: 224\r\nrating: 4\r\ndate: 2024-08-15\r\nstatus: 🟩 Done\r\ncover: \"[[sketchnote-handbook.webp]]\"\r\ntags:\r\n  - book\r\naliases:\r\n  - کتاب راهنمای اسکچ نوت\r\nbadge:\r\n  - 🦉آموزنده\r\ncover_source: https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1354312096i/15858089.jpg\r\nlanguage: en\r\n---\r\n\r\n\r\n"},{"id":"notes/The PARA Method Simplify, Organize, and Master Your Digital Life.md","title":"The PARA Method Simplify, Organize, and Master Your Digital Life","path":"notes/The PARA Method Simplify, Organize, and Master Your Digital Life.md","folder":"notes","ext":"md","ctime":1795633696586,"mtime":1795633696586,"size":1267,"links":[],"tags":["book"],"properties":{"author":"Tiago Forte","pages":203,"rating":3,"date":"2025-09-10","status":null,"cover":"[[para-method.webp]]","tags":["book"],"badge":["🪶خوش‌خوان"],"cover_source":"https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1683399809i/134634583.jpg","language":"en"},"computedFormulas":{"starRating":"★★★","Untitled":""},"coverImage":"assets/images/para-method-vq5zt8.webp","coverAssetRelativePath":"assets/images/para-method-vq5zt8.webp","htmlContent":"\u003cp dir=\"auto\">The system you use to organize information has to be so simple that it frees up your attention, instead of taking more of it. Your system must give you time, not take time. (25)\u003c/p>\n\u003chr>\n\u003cp dir=\"auto\">So much of what we call “organizing” is essentially procrastination in disguise. We tell ourselves we’re “getting ready” or “doing research,” pretending like that means progress. (37)\u003c/p>\n\u003chr>\n\u003cp dir=\"auto\">The Era of the Wisdom Worker\u003cbr>\nFor decades, we’ve called ourselves “knowledge workers” based on the fact that knowledge was our main asset. More than sixty years after that term was coined, the era of the knowledge worker is finally coming to a close. Knowledge has been commoditized and made universally accessible, first through search engines and now through increasingly advanced artificial intelligence. Which means there is no advantage to knowing any particular piece of knowledge anymore. We are now entering the era of the Wisdom Worker. (147)\u003c/p>","rawMarkdown":"---\r\nauthor: Tiago Forte\r\npages: 203\r\nrating: 3\r\ndate: 2025-09-10\r\nstatus:\r\ncover: \"[[para-method.webp]]\"\r\ntags:\r\n  - book\r\nbadge:\r\n  - 🪶خوش‌خوان\r\ncover_source: https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1683399809i/134634583.jpg\r\nlanguage: en\r\n---\r\n\r\nThe system you use to organize information has to be so simple that it frees up your attention, instead of taking more of it. Your system must give you time, not take time. (25)\r\n\r\n---\r\n\r\nSo much of what we call “organizing” is essentially procrastination in disguise. We tell ourselves we’re “getting ready” or “doing research,” pretending like that means progress. (37)\r\n\r\n\r\n\r\n---\r\n\r\nThe Era of the Wisdom Worker \r\nFor decades, we’ve called ourselves “knowledge workers” based on the fact that knowledge was our main asset. More than sixty years after that term was coined, the era of the knowledge worker is finally coming to a close. Knowledge has been commoditized and made universally accessible, first through search engines and now through increasingly advanced artificial intelligence. Which means there is no advantage to knowing any particular piece of knowledge anymore. We are now entering the era of the Wisdom Worker. (147)\r\n"},{"id":"notes/The Phantom of the Opera.md","title":"The Phantom of the Opera","path":"notes/The Phantom of the Opera.md","folder":"notes","ext":"md","ctime":1795633696586,"mtime":1795633696586,"size":411,"links":[],"tags":["book"],"properties":{"author":["Jennifer Bassett"],"translator":null,"pages":64,"source":"https://www.goodreads.com/book/show/2974076","cover":"[[The Phantom of the Opera.webp]]","cover_source":"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1352395155i/2974076.jpg","date":"2026-07-10","tags":["book"],"badge":["🌀مرموز"],"rating":4,"genre":null,"status":null,"type":"Novel","publisher":"Oxford","language":"en"},"computedFormulas":{"starRating":"★★★★","Untitled":""},"coverImage":"assets/images/The Phantom of the Opera-15z6gb.webp","coverAssetRelativePath":"assets/images/The Phantom of the Opera-15z6gb.webp","htmlContent":"","rawMarkdown":"---\r\nauthor:\r\n  - Jennifer Bassett\r\ntranslator:\r\npages: 64\r\nsource: https://www.goodreads.com/book/show/2974076\r\ncover: \"[[The Phantom of the Opera.webp]]\"\r\ncover_source: https://m.media-amazon.com/images/S/compress
