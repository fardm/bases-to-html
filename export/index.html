6,"size":24616,"links":["قلعه حیوانات","اثر پذیری مردم از حاکمان یا حاکمان از مردم؟"],"tags":["book"],"properties":{"author":"حمید یگانه","translator":null,"pages":114,"rating":4,"date":"2026-03-15","status":"✍ To write","cover":"[[farhang-goftari.webp]]","tags":["book"],"badge":null,"genre":null,"cover_source":null,"language":"fa"},"computedFormulas":{"starRating":"★★★★","Untitled":""},"coverImage":"assets/images/farhang-goftari-87j4u4.webp","coverAssetRelativePath":"assets/images/farhang-goftari-87j4u4.webp","htmlContent":"\u003ch1 data-heading=\"چکیده\" dir=\"auto\">چکیده\u003c/h1>\n\u003ch1 data-heading=\"خلاصه\" dir=\"auto\">خلاصه\u003c/h1>\n\u003ch2 data-heading=\"تئوری فرهنگ گفتاری و نوشتاری\" dir=\"auto\">تئوری فرهنگ گفتاری و نوشتاری\u003c/h2>\n\u003cp dir=\"auto\">در جامعه‌های بشری می توان دو نوع فرهنگ را تشخیص داد:\u003c/p>\n\u003col>\n\u003cli dir=\"auto\">فرهنگ گفتاری: فرهنگی است که برای ایجاد و انتقال مفاهیم در جامعه عمدتا بر گفتار تکیه می‌کند.\u003c/li>\n\u003cli dir=\"auto\">فرهنگ نوشتاری: فرهنگی است که برای ایجاد و انتقال مفاهیم عمدتا از نوشتار استفاده می‌کند.\u003c/li>\n\u003c/ol>\n\u003ch2 data-heading=\"ویژگی فرهنگ گفتاری و فرهنگ نوشتاری\" dir=\"auto\">ویژگی فرهنگ گفتاری و فرهنگ نوشتاری\u003c/h2>\n\u003col>\n\u003cli dir=\"auto\">\n\u003cp>زمان غیر خطی\u003cbr>\nدر فرهنگ گفتاری وقت شناسی مرسوم نیست و فرصت‌ها هدر می‌روند چون زمان را یک کیفیت مدور تصور می‌کنند. در فرهنگ نوشتاری زمان را یک ماهیت خطی تصور می‌کنند به همین خاطر ارزشمند است و دقیق اندازه گرفته می‌شود.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>پیام رسانی غیرمستقیم و مبهم\u003cbr>\nدر ایران گفتگوها مبهم و غیر مستقیم است. اغلب تعارف میکنند و برای فهمیدن منظور آنها باید به حاشیه و زمینه هم توجه کرد.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>// جمع گرایی\u003cbr>\nدر فرهنگ گفتاری ارتباط و انتقال پیام در جمع انجام می شود و در حالت انفرادی امکان ندارد. در مقابل فرهنگ نوشتاری انفرادی است. نوشته در حالت فردی مطالعه می شود.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>// جامعه طبقاتی\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>گذشته گرایی\u003cbr>\nفرهنگ‌های گفتاری عموما گذشته‌گرا هستند در حالی که فرهنگ‌های نوشتاری بیشتر آینده گرا هستند. در فرهنگ نوشتاری اطلاعات ذخیره می شوند و همیشه در دسترس خواهند بود، پس از قید و بند گذشته آزاد هستند و با اطمینان از حفظ اطلاعات می توانند به برنامه ریزی برای در آینده بپردازدند. در فرهنگ گفتاری اطلاعات شفاهی مبادله می شوند و در ذهن ذخیره می شوند که ظرفیت محدودی دارد. پس جامعه مجبور است اطلاعات را به صورت سنت، آیین و رسم در بیاورد تا ماندگار باشند.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>// اهمیت سنت و مذهب\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>انقیاد و انفعال\u003cbr>\nفرهنگ‌های نوشتاری به خاطر فردگرایی، برابری و خردگرایی آزاد و مسئولیت پذیر هستند. در مقابل فرهنگ‌های گفتاری به خاطر جبرگرایی، اعتقاد به تقدیر و خرافات گرایش زیادی به انقیاد و انفعال دارند. \u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>انتقال دشوار مفاهیم\u003cbr>\nدر نوشتار مفاهیم به صورت منظم و با دقت عرضه می شود و در طولانی مدت قابل استفاده خواهد بود. مطالبی که در گفتار بیان می شوند معمولا نامرتب و فاقد دقت هستند.\u003cbr>\nعلاوه بر این در ایران فاصله زیادی بین گفتار و نوشتار وجود دارد که انتقال مفاهیم را دشوارتر می‌کند. مردم به یک زبان سخنم می گویند و به یک زبان دیگر می نویسند. عبارات گفتاری قابل ترجمه به نوشتار نیست و گاهی نوشته‌ها قابل بیان نیست.\u003cbr>\nدر گفتار ظرفیت بررسی مفاهیم پیچیده وجود ندارد و نمیتوان وارد جزئیات شد. در نوشتار است که آمار و ارقام یک پدیده ثبت می شود. در بسیاری از کشورهای توسعه نیافته مثل ایران آمار و ارقام درستی وجود ندارد و اتفاقات به دقت اندازه گیری نمی شوند.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>در مدیریت\u003cbr>\nفرهنگ های گفتاری توان برنامه ریزی ندارد چون برنامه ریزی فعالیتی فکری و انتزاعی است و فقط به صورت نوشتاری ممکن است.\u003cbr>\nاستخدام نیروی کار در فرهنگ های گفتاری اغلب بر اساس روابط شخصی، خانوادگی و اعمال نفوذ انجام می شود. چون گفتار با ارتباط عاطفی و انسانی آمیخهته است و از حالت عقلانی خارج است. اما نوشتار سرد و منطقی است درگیر احساسات و پارتی بازی نمی شود.\u003cbr>\nمدیریت در ایران حجره‌ای و جهادی است. از روش های منطقی و عقلانی برای تصمیم گیری و برنامه ریزی استفاده نمی شود.\u003cbr>\nحجره 52\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>فساد\u003cbr>\nدر فرهنگ های گفتاری جزئیات مقررات به روشنی نوشته نمی شوند و زمینه را برای تخطی و فساد معیا می کنند. فرهنگ گفتاری با چاپلوسی، دروغ گویی، اغراق و تملق ارتباط دارد. دروغ گفتن معمول تر از دروغ نوشتن است. تملق بیشتر از آنچه نوشتنی باشد گفتنی است به زبان چرب و نرم و بر انگیختن احساسات نیاز دارد. نوشته معمولا بدون تحریک احساسات خوانده می شود.\u003cbr>\nسیستم های حسابداری، حسابرسی، کنترل و قانون بخشی از ساز و کار های موثر برای جلوگیری از فساد هستند که با وجود یک فرهنگ نوشتاری قابل اجرا هستند. در ایران هزینه های اصولا جایی ثبت نمی شودند معاملات شفاهی انجام می شود. بسیاری از آیین نامه های مجلس و دولت قابل فهم نیستند. شامل اصطلاحات عربی نامفهوم هستند.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>کسب و کار\u003cbr>\nقیمت گذاری مبهم است فروشنده خریدار را شناسایی می کند و بسته به وسع مالی قیمت را تا حد ممکن افزایش می دهد. چانه زنی متداول است. قیمت، وزن، سرعت، نمره، کمیت، کیفیت و هر نوع مفهوم مشمول تفسیر به رأی می شوند. \u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>در آموزش و یادگیری\u003cbr>\nدر فرهنگ گفتاری حفظ کردن اهمیت دارد. در مقابل در فرهنگ نوشتاری تفکر انقتادی و پرسش‌گری مورد توجه است. حفظ کردن با تفکر انتقادی متضاد به نظر می رسد. اگر مطلبی را حفظ کنیم یعنی در کمال و تمام بدون پرسش و انتقاد آن را پذیرفته ایم و از آن محافظت می کنیم. در مقابل تفکر انتقادی ممکن است به تغییر و تبدیل و یا حتی نابودی کی مطلب منجر شود.\u003cbr>\n// در ادبیات\u003cbr>\nدر ادبیات ایران بیشتر شعر رایج است تا رمان یا جستار. شعر کلامی دلپذیر است که مورد بحث و انتقاد قرار نمی گیرد. شعر به عنوان سخن موزون در حافظه باقی می ماند و به فرهنگ و سنت و آداب و رسوم ماندگاری می بخشد. شعر مفهوم روشنی ندارد و تا حد زیادی ابهام دارد. شاعر شعر نمی نویسند. شعر می سراید، شعر می گوید.\u003cbr>\nدر مقابل رمان نوعی اثر ادبی است که مختص فرهنگ نوشتاری است. رمان توصیفی دقیق، منطقی و جزئی از حوادث مختلف است. هرچند ممکن است بر اساس خیال پردازی نویسنده شکل گرفته باشد اما واقع نماست. پیوستگی رمان نوعی نظم و ترتیب خاص در ذهن خواننده ایجاد می کند و باعث تقویت ادراک خطی زمان نزد او می شود.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>در علوم\u003cbr>\nزبان گفتار از بیان مطالب علمی و پیچیده نا توان است. خرافه گرای، مذهب گرایی، گذشته گرایی  در فرهنگ گفتاری مانند ایران بسیار پرقدرت هستند و مانع پیشرفت دانش و تکنولوژی می شوند.\u003cbr>\nحرفه و فن در فرهنگ گفتاری توسعه چندانی ندارند چون نوشته جات کافی در این زمینه ها وجود ندارد. تکنینک ها و روش ها جایی نوشته نمی شوند و به به درستی به نسل بعد منتقل نمی شوند. \u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>در حکمرانی\u003cbr>\nجنبش های آزادی خواهی و دموکراسی طلبی اغلب در ایران شکست خورده اند. دموکراسی نیازمند ساختاری ویژه و قانونمند است. قانون باید نوشتار منسجم و بدون ابهام باشد. نمی تواند به صورت گفتار باشد.\u003cbr>\nخشونت سیاسی\u003cbr>\nجوامع دارای فرهنگ گفتاری معمولا بیشتر مستعد خشونت و درگیری سیاسی هستند. ریشه بسیاری از خشونت های سیاسی در ایران در نفهمیدن و نفهماندن بوده است. مطلبی که از بالای یک تریبون فریاد زده شودف بدون آنکه سنجیده یا فهمیده شود باعث بروز حرکت های سیاسی و به تبع آن خشونت و درگیری می شود. در بسیاری از خشونت های سیاسی هر طرف بر موضوع خود پافشاری میکند و بدون درک درستی از مطالب و نظرات مخالف دست به اسلحه می برد. هنگامی که احساسات تحریک می شوند و عقل و منطق از بین می روند چیزی بجز خشونت نمی توان انتظار داشت.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003ch2 data-heading=\"نتیجه گیری\" dir=\"auto\">نتیجه گیری\u003c/h2>\n\u003cp dir=\"auto\">نداشتن فرهنگ نوشتاری یکی از موانع مهم توسعه‌ی اقتصادی و اجتماعی محسوب می‌شود. فرهنگ‌های گفتاری قادر نخواهند بود تمدن‌های بزرگی بسازند و دموکراسی را در جامعه مستقر کنند. یک جامعه پیشرفته به دستورهای دقیق و مدون نیاز دارد. اگر نتوانیم چیزی را به درستی بنویسیم نمی توانیم به روشنی درمورد آن فکر کنیم چون اندیشیدن دقیق بدون نوشتن آن ممکن نیست.\u003c/p>\n\u003ch2 data-heading=\"نقد این تئوری\" dir=\"auto\">نقد این تئوری\u003c/h2>\n\u003cp dir=\"auto\">پدیده‌های اجتماعی یک علتی نیستند به همین خاطر نمی‌توان تنها عامل توسعه نیافتگی ایران را نداشتن فرهنگ نوشتاری دانست. همچنین میتواند رابطه علت و معلول در این مسئله دو طرفه باشد یعنی همه جوامع دارای فرهنگ گفتاری هستند و به تدریج در هر مرحله از توسعه صاحب فرهنگ نوشتاری می‌شوند. (به این ترتیب عدم توسعه هم علت و هم معلول فرهنگ گفتاری است.)\u003c/p>\n\u003ch1 data-heading=\"نشانه\" dir=\"auto\">نشانه\u003c/h1>\n\u003cp dir=\"auto\">محمود سریع القلم: کسی که زبان انگلیسی نمی‌داند نمی تواند منطقی فکر کند.39\u003c/p>\n\u003cp dir=\"auto\">جامعه کلنگی فرهنگ کلنگی 46\u003c/p>\n\u003cp dir=\"auto\">فریدون هویدا: رهبر در جامعه ای مانند ایران در حکم پدری مستبد است که خود را مجاز می داند تا فرزندانش را به شدت تنبیه کند. 50\u003c/p>\n\u003cp dir=\"auto\">فاصله‌ی زیاد زبان گفتار و زبان نوشتار در جامعه ایران یکی از علت های بزرگ پایین بودن سرانه‌ی مطالعه است. مثلا اکثر ترجیح می دهند باب یک کارمند بانک صحبت کنند تا اینکه اطلاعات یک قراداد سرمایه گذاری را مطالعه کنند. به دلیل جدایی گفتار و نوشتار چنین می نماید که مردم یران به یک زبان حرف می زنند و به زبانی دیگر می نویسند و می خوانند. این دوگانگی چنان قابل توجه است که زبان نوشتار برای اکثر مردم زبانی بیگانه و عاری از احساس و صمیمیت به نظر می رسد. 68\u003c/p>\n\u003cp dir=\"auto\">شعر کلامی دلپذیر و خوشایند است. مورد انتقاد و بحث قرار نمی گیرد. البته شعر هنر بسیار والایی است و استادان شعر فارسی مانند سعدی و رودکی و فردوسی خدمت های بسیاری به فرنگ و تمدن و جامعه ایرانی کرده اند. اما باید در نظر داشت که برخی جنبه های شعر تاثیر مثبتی بر زبانف فرهنگ و جامعه‌ی ایرانی نداشته اند و به جای خردورزی و درست نویسی، ابهام و سردرگمی را رواج داده اند. 74\u003c/p>\n\u003cp dir=\"auto\">شبکه های اجتماعی\u003cbr>\nکشور های توسه یافته که دارای فرهنگ های نوشتاری منسجمی هستند نخست از مرحله گفتاری به مرحله نوشتاری رسیده اند و پس از آن وارد مرحله‌ی دیجیتالی و مجازی شده اند. در کشورهای توسعه نیافته از جمله ایران که فاقد فرهنگ نوشتاری منسجمی بوده اند به ناگاها از فرهنگ گفتاری سنتی به دنیای عجیب و غریب دیجیتال وارد شده اند. بدین ترتیب تکنولوژی های جدید تاثیر مخربی روی فرهنگ نوشتاری ایران گذاشته اند. باعث شده نوشتار فارسی به زبان محاوره تقلیل یابد.\u003c/p>\n\u003ch1 data-heading=\"حاشیه\" dir=\"auto\">حاشیه\u003c/h1>\n\u003ch2 data-heading=\"تحلیل کتاب\" dir=\"auto\">تحلیل کتاب\u003c/h2>\n\u003cp dir=\"auto\">اغلب کتاب های جامعه شناسی مفصل و سخت خوان اند و عموم مردم اقبالی به خواندن آن ندارند. اما این کتاب خوشخوان و روان بود. اطاله کلام نداشت مختصر و مفید حرفش را زده بود. (کتاب جامعه شناسی را باید مردم جامعه بخوانند نه فقط جامعه شناس ها)\u003cbr>\nبرای اثبات مدعای خود به درستی نمونه ها و مصادیق را جمع آوری کرده بود، تئوری و نظریه ها را مطرح کرده بود و تلاش کرده بود این داده ها را به هم متصل کند تا یک شبکه منسجم از اطلاعات بسازد. در آخر هم به درستی حد و مرز مدعای خود و میزان قابل دفاع بودن آن را مشخص کرده بود. بزرگ نمایی و مبالغه نکرده بود که آهایی ببینید من چه اکتشافی کرده ام.\u003cbr>\nآه و افسوس و ناله های بسیار هم سر نداده بود که وای ایران توسعه نیافته و از دست رفته است. مستقیم متهم نکرده بود به اشاره ای مختصر کفایت کرده بود. افسار بحث از دستش خارج نشده بود و حاشیه نمی رفت.\u003c/p>\n\u003cp dir=\"auto\">همانطور که خود نویسنده اشاره کرد این تئوری کامل و جامع نیست و قابل خدشه است. اما به نظرم این گزاره دست کم دو فایده‌ی مهم دارد:\u003c/p>\n\u003col>\n\u003cli dir=\"auto\">درک بهتر: این تفکیک صورت بندی خوبی در ذهن مان ایجاد می کند. پدیده ها و مصادیق و نمونه های عینی در جامعه را بهتر می توانیم درک کنیم و در ذهنمان دسته بندی کنیم. پدیده ها و اتفاقات اطرافمان را بهتر درک میکنم. می فهمیم چرا این تصمیم گرفته شده، چرا این رفتار شکل گرفته و چرا این واکنش صورت گرفته.\u003c/li>\n\u003cli dir=\"auto\">اقدام عملی کوچک و مشخص: با این گزاره برای اصلاح جامعه و رسیدن به توسعه یک اقدام عملی واضح و مشخص داریم. اگر فهرستی از همه عوامل توسعه نیافتگی ایران فراهم کنیم به طوماری میرسیم که حتی حوصله نداریم نگاهش کنیم. اما وقتی یک عامل مشخص داشته باشیم - که از قضا دایره شمولیت آن گسترده باشد - اقدام کردن راحت تر است. میتوانیم با نوشتن زمینه توسعه جامعه خود را فراهم کنیم. میتوانیم از خودمان شروع کنیم. بنویسیم تا شفاف تر فکر کنیم و دقیق تر حرف بزنیم. دیگران را به نوشتن ترغیب کنیم و مثل یک ویروس این به شیوع گسترده آن کمک کنیم و به تدریج گرایش جامعه را به نوشتن سوق دهیم. \u003c/li>\n\u003c/ol>\n\u003cul>\n\u003cli dir=\"auto\">توی متمم هم نوشته بود که وقتی یک مدل ارائه می دهیم برای این است که واقع را بهتر درک کنیم. هیچ وقت ادعای تطابق کامل و جهان شمول بودن نداریم.\u003c/li>\n\u003c/ul>\n\u003ch2 data-heading=\"نقد\" dir=\"auto\">نقد\u003c/h2>\n\u003cp dir=\"auto\">چرخه علی\u003cbr>\nخودزنی\u003c/p>\n\u003ch2 data-heading=\"مطالب مرتبط\" dir=\"auto\">مطالب مرتبط\u003c/h2>\n\u003cp dir=\"auto\">قانون باید شفاف و واضح باشد. تفسیر پذیر نباشد. یاد \u003ca class=\"internal-link\" href=\"قلعه حیوانات\" data-href=\"قلعه حیوانات\" target=\"_blank\" rel=\"noopener nofollow\">قلعه حیوانات\u003c/a> افتادم. قانون با اینکه نوشته شده بود اما همه سواد نداشتند بخوانند. همان قوانین به قدری تغییر کردند که چیزی از آن باقی نماند و دقیقا عکس آن عمل شد و به عنوان قانون معرفی شد.\u003c/p>\n\u003cp dir=\"auto\">یادداشت \u003ca class=\"internal-link\" href=\"اثر پذیری مردم از حاکمان یا حاکمان از مردم؟\" data-href=\"اثر پذیری مردم از حاکمان یا حاکمان از مردم؟\" target=\"_blank\" rel=\"noopener nofollow\">اثر پذیری مردم از حاکمان یا حاکمان از مردم؟\u003c/a> | چرخه علی \u003c/p>\n\u003cdiv class=\"callout is-collapsible is-collapsed node-insert-event\" data-callout=\"note\" data-callout-fold=\"-\" data-callout-metadata=\"\">\u003cdiv class=\"callout-title\" dir=\"auto\">\u003cdiv class=\"callout-icon\">\u003csvg width=\"16\" height=\"16\">\u003c/svg>\u003c/div>\u003cdiv class=\"callout-title-inner\">می‌نویسم تا برای توسعه‌یافتن ایران قدمی برداشته باشم\u003c/div>\u003cdiv class=\"callout-fold is-collapsed\">\u003csvg xmlns=\"http://www.w3.org/2000/svg\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"svg-icon lucide-chevron-down\">\u003cpath d=\"m6 9 6 6 6-6\">\u003c/path>\u003c/svg>\u003c/div>\u003c/div>\u003cdiv class=\"callout-content\" style=\"display: none;\">\n\u003cp dir=\"auto\">احتمالا می‌پرسید توسعه‌یافتن ایران چه ربطی به نوشتن دارد؟ من هم چندی پیش اصلا این دو کلمه را در کنار هم ندیده بودم اما حالا ارتباط خاصی بین آن دو می‌بینم و امروز آن را برای شما شرح ‌می‌دهم تا علاوه بر فهمیدن آن، انگیزه‌تان برای نوشتن دوچندان شود.\u003c/p>\n\u003cp dir=\"auto\">«نوشتن برای توسعه یافتن» ایده‌ای است که بعد از خواندن کتاب «فرهنگ گفتاری» در ذهنم شعله‌ور شد. نویسنده در این کتاب جامعه‌های بشری را به دو دسته‌ی فرهنگ‌ گفتاری و نوشتاری تقسیم می‌کند. در فرهنگ‌های گفتاری برای انتقال مفاهیم معمولا بر گفتار تکیه می‌کنند اما در فرهنگ‌های نوشتاری اغلب از نوشتار استفاده می‌کنند.\u003c/p>\n\u003cp dir=\"auto\">ادعای نویسنده این است که نداشتن فرهنگ نوشتاری یکی از موانع مهم توسعه‌ی اقتصادی و اجتماعی محسوب می‌شود. فرهنگ‌های گفتاری قادر نخواهند بود تمدن‌های بزرگی بسازند و دموکراسی را در جامعه مستقر کنند. متاسفانه در جامعه‌ی ایران فرهنگ گفتاری غالب است و مردم گرایش کمتری به نوشتن دارند. به همین خاطر یکی از دلایل توسعه نیافتگی ایران نبود فرهنگ نوشتاری است.\u003c/p>\n\u003cp dir=\"auto\">بین گفتار و نوشتار تفاوت‌های بنیادین وجود دارد. در گفتار معمولا مطالب نامرتب و فاقد دقت هستند. پیام‌ها مبهم و غیرمستقیم‌اند و انتقال مفاهیم به سختی انجام می‌شود. لغزش و خطا در گفتار شایع‌تر است. زبان گفتار از بیان مطالب علمی و پیچیده عاجز است. احساسات و عواطف در گفتار پررنگ‌تر است. در مقابل نوشتار سرد و منطقی است و مفاهیم به صورت منظم و با دقت عرضه می‌شوند. \u003c/p>\n\u003cp dir=\"auto\">در جوامعی که گفتار بر نوشتار غلبه کند فرهنگ گفتاری شکل می‌گیرد. فرهنگ‌های گفتاری جوامعی سنتی و گذشته‌گرا هستند. به خاطر جبرگرایی، اعتقاد به تقدیر و خرافات گرایش به انقیاد و انفعال دارند. گوینده بیشتر از گفته مورد توجه است. مکالمات با تعارف، کنایه، چاپلوسی، اغراق، تملق و دروغ گویی آمیخته است. قوانین به روشنی نوشته نمی‌شوند و ابهام و تفسیرپذیری مقررات زمینه فساد را فراهم می‌کند. هزینه‌ها اصولا جایی ثبت نمی‌شوند و معاملات شفاهی انجام می‌شوند. سیستم‌های حسابداری و حسابرسی وجود ندارند. آمار و ارقام ثبت نمی‌شوند و گزارشی ارائه نمی‌شود. حفظ کردن و به خاطر سپردن بیشتر از تفکر انتقادی و پرسشگری مورد توجه است. در حالی که فرهنگ‌های نوشتاری نقطه‌ی مقابل این ویژگی‌ها هستند.\u003c/p>\n\u003cp dir=\"auto\">نویسنده به همین ترتیب به ذکر نمونه‌ها و مصادیقی از پدیده‌های موجود در ایران می‌پردازد تا خواننده را با خود هم‌رأی کند که چطور فرهنگ گفتاری در جامعه، اقتصاد، مدیریت و حکمرانی اثر می‌گذارد و مانع پیشرفت و توسعه می‌شود.\u003c/p>\n\u003cp dir=\"auto\">البته همانطور که خود نویسنده اشاره می‌کند پدیده‌های اجتماعی تک علتی نیستند و نمی‌توان تنها عامل توسعه نیافتگی ایران را نداشتن فرهنگ نوشتاری معرفی کرد.\u003c/p>\n\u003cp dir=\"auto\">به هرحال این تئوری با تمام کاستی‌ها و استثناها دست‌کم برای من دو فایده‌ دارد:\u003c/p>\n\u003cp dir=\"auto\">اول اینکه درک بهتری از اتفاقات اطرافم داشته باشم. این تفکیک به صورت‌بندی پدیده‌ها در ذهنم کمک شایانی می‌کند و می‌توانم آنها را دسته‌بندی کنم. حالا آگاهی کامل‌تری از مشکلات، تصمیمات، واکنش‌ها و رفتارهای خودم یا دیگران دارم و می‌توانم آنها را تحلیل کنم.\u003c/p>\n\u003cp dir=\"auto\">دوم اینکه یک اقدام عملی کوچک و مشخص داشته باشم. اگر فهرستی از همه عوامل توسعه نیافتگی ایران بنویسیم به طوماری می‌رسیم که حتی حوصله نداریم نگاهش کنیم. اقداماتی که خیلی از آنها خارج از اختیارات ماست. اما با این تئوری من یک وظیفه مشخص دارم که به سادگی قابل انجام است. می‌توانم از خودم شروع کنم. بنویسم تا شفاف‌تر فکر کنم و دقیق‌تر حرف بزنم و با ترغیب دیگران به نوشتن به‌تناوب به توسعه‌ی جامعه کمک کنم.\u003c/p>\n\u003cp dir=\"auto\">من بعید می‌دانم سیستم فعلی قابل اصلاح باشد. چشم امیدی هم به مداخله‌ی خارجی ندارم. خودمان هستیم که باید برای این فلاکت و بیرون کشیدن ایران از آن چاره‌‌ای بجوییم و اقدامی کنیم.\u003c/p>\n\u003cp dir=\"auto\">بیایید مرضِ نوشتن را به جان همدیگر بی‌اندازیم و با شیوع گسترده‌ی آن به‌تدریج گرایش جامعه را به نوشتن سوق دهیم. به غلبه‌ی فرهنگ نوشتاری کمک کنیم و زمینه‌ی توسعه و پیشرفت ایران را فراهم کنیم.\u003c/p>\n\u003c/div>\u003c/div>","rawMarkdown":"---\nauthor: حمید یگانه\ntranslator:\npages: 114\nrating: 4\ndate: 2026-03-15\nstatus: ✍ To write\ncover: \"[[farhang-goftari.webp]]\"\ntags:\n  - book\nbadge:\ngenre:\ncover_source:\nlanguage: fa\n---\n\n#   چکیده\n\n\n# خلاصه\n\n## تئوری فرهنگ گفتاری و نوشتاری\nدر جامعه‌های بشری می توان دو نوع فرهنگ را تشخیص داد:\n1. فرهنگ گفتاری: فرهنگی است که برای ایجاد و انتقال مفاهیم در جامعه عمدتا بر گفتار تکیه می‌کند.\n2. فرهنگ نوشتاری: فرهنگی است که برای ایجاد و انتقال مفاهیم عمدتا از نوشتار استفاده می‌کند.\n\n## ویژگی فرهنگ گفتاری و فرهنگ نوشتاری\n\n1. زمان غیر خطی\n   در فرهنگ گفتاری وقت شناسی مرسوم نیست و فرصت‌ها هدر می‌روند چون زمان را یک کیفیت مدور تصور می‌کنند. در فرهنگ نوشتاری زمان را یک ماهیت خطی تصور می‌کنند به همین خاطر ارزشمند است و دقیق اندازه گرفته می‌شود.\n\n2. پیام رسانی غیرمستقیم و مبهم\n   در ایران گفتگوها مبهم و غیر مستقیم است. اغلب تعارف میکنند و برای فهمیدن منظور آنها باید به حاشیه و زمینه هم توجه کرد.\n3. // جمع گرایی \n   در فرهنگ گفتاری ارتباط و انتقال پیام در جمع انجام می شود و در حالت انفرادی امکان ندارد. در مقابل فرهنگ نوشتاری انفرادی است. نوشته در حالت فردی مطالعه می شود.\n4. // جامعه طبقاتی\n   \n5. گذشته گرایی\n   فرهنگ‌های گفتاری عموما گذشته‌گرا هستند در حالی که فرهنگ‌های نوشتاری بیشتر آینده گرا هستند. در فرهنگ نوشتاری اطلاعات ذخیره می شوند و همیشه در دسترس خواهند بود، پس از قید و بند گذشته آزاد هستند و با اطمینان از حفظ اطلاعات می توانند به برنامه ریزی برای در آینده بپردازدند. در فرهنگ گفتاری اطلاعات شفاهی مبادله می شوند و در ذهن ذخیره می شوند که ظرفیت محدودی دارد. پس جامعه مجبور است اطلاعات را به صورت سنت، آیین و رسم در بیاورد تا ماندگار باشند.\n6. // اهمیت سنت و مذهب\n7. انقیاد و انفعال\n   فرهنگ‌های نوشتاری به خاطر فردگرایی، برابری و خردگرایی آزاد و مسئولیت پذیر هستند. در مقابل فرهنگ‌های گفتاری به خاطر جبرگرایی، اعتقاد به تقدیر و خرافات گرایش زیادی به انقیاد و انفعال دارند. \n8. انتقال دشوار مفاهیم\n   در نوشتار مفاهیم به صورت منظم و با دقت عرضه می شود و در طولانی مدت قابل استفاده خواهد بود. مطالبی که در گفتار بیان می شوند معمولا نامرتب و فاقد دقت هستند.   \n   علاوه بر این در ایران فاصله زیادی بین گفتار و نوشتار وجود دارد که انتقال مفاهیم را دشوارتر می‌کند. مردم به یک زبان سخنم می گویند و به یک زبان دیگر می نویسند. عبارات گفتاری قابل ترجمه به نوشتار نیست و گاهی نوشته‌ها قابل بیان نیست.\n   در گفتار ظرفیت بررسی مفاهیم پیچیده وجود ندارد و نمیتوان وارد جزئیات شد. در نوشتار است که آمار و ارقام یک پدیده ثبت می شود. در بسیاری از کشورهای توسعه نیافته مثل ایران آمار و ارقام درستی وجود ندارد و اتفاقات به دقت اندازه گیری نمی شوند.\n\n9. در مدیریت\n   فرهنگ های گفتاری توان برنامه ریزی ندارد چون برنامه ریزی فعالیتی فکری و انتزاعی است و فقط به صورت نوشتاری ممکن است.\n   استخدام نیروی کار در فرهنگ های گفتاری اغلب بر اساس روابط شخصی، خانوادگی و اعمال نفوذ انجام می شود. چون گفتار با ارتباط عاطفی و انسانی آمیخهته است و از حالت عقلانی خارج است. اما نوشتار سرد و منطقی است درگیر احساسات و پارتی بازی نمی شود.\n   مدیریت در ایران حجره‌ای و جهادی است. از روش های منطقی و عقلانی برای تصمیم گیری و برنامه ریزی استفاده نمی شود.\n   حجره 52\n10. فساد\n    در فرهنگ های گفتاری جزئیات مقررات به روشنی نوشته نمی شوند و زمینه را برای تخطی و فساد معیا می کنند. فرهنگ گفتاری با چاپلوسی، دروغ گویی، اغراق و تملق ارتباط دارد. دروغ گفتن معمول تر از دروغ نوشتن است. تملق بیشتر از آنچه نوشتنی باشد گفتنی است به زبان چرب و نرم و بر انگیختن احساسات نیاز دارد. نوشته معمولا بدون تحریک احساسات خوانده می شود. \n    سیستم های حسابداری، حسابرسی، کنترل و قانون بخشی از ساز و کار های موثر برای جلوگیری از فساد هستند که با وجود یک فرهنگ نوشتاری قابل اجرا هستند. در ایران هزینه های اصولا جایی ثبت نمی شودند معاملات شفاهی انجام می شود. بسیاری از آیین نامه های مجلس و دولت قابل فهم نیستند. شامل اصطلاحات عربی نامفهوم هستند.\n11. کسب و کار\n    قیمت گذاری مبهم است فروشنده خریدار را شناسایی می کند و بسته به وسع مالی قیمت را تا حد ممکن افزایش می دهد. چانه زنی متداول است. قیمت، وزن، سرعت، نمره، کمیت، کیفیت و هر نوع مفهوم مشمول تفسیر به رأی می شوند. \n12. در آموزش و یادگیری\n    در فرهنگ گفتاری حفظ کردن اهمیت دارد. در مقابل در فرهنگ نوشتاری تفکر انقتادی و پرسش‌گری مورد توجه است. حفظ کردن با تفکر انتقادی متضاد به نظر می رسد. اگر مطلبی را حفظ کنیم یعنی در کمال و تمام بدون پرسش و انتقاد آن را پذیرفته ایم و از آن محافظت می کنیم. در مقابل تفکر انتقادی ممکن است به تغییر و تبدیل و یا حتی نابودی کی مطلب منجر شود.\n    // در ادبیات\n    در ادبیات ایران بیشتر شعر رایج است تا رمان یا جستار. شعر کلامی دلپذیر است که مورد بحث و انتقاد قرار نمی گیرد. شعر به عنوان سخن موزون در حافظه باقی می ماند و به فرهنگ و سنت و آداب و رسوم ماندگاری می بخشد. شعر مفهوم روشنی ندارد و تا حد زیادی ابهام دارد. شاعر شعر نمی نویسند. شعر می سراید، شعر می گوید.\n    در مقابل رمان نوعی اثر ادبی است که مختص فرهنگ نوشتاری است. رمان توصیفی دقیق، منطقی و جزئی از حوادث مختلف است. هرچند ممکن است بر اساس خیال پردازی نویسنده شکل گرفته باشد اما واقع نماست. پیوستگی رمان نوعی نظم و ترتیب خاص در ذهن خواننده ایجاد می کند و باعث تقویت ادراک خطی زمان نزد او می شود.\n13. در علوم\n    زبان گفتار از بیان مطالب علمی و پیچیده نا توان است. خرافه گرای، مذهب گرایی، گذشته گرایی  در فرهنگ گفتاری مانند ایران بسیار پرقدرت هستند و مانع پیشرفت دانش و تکنولوژی می شوند. \n    حرفه و فن در فرهنگ گفتاری توسعه چندانی ندارند چون نوشته جات کافی در این زمینه ها وجود ندارد. تکنینک ها و روش ها جایی نوشته نمی شوند و به به درستی به نسل بعد منتقل نمی شوند. \n14. در حکمرانی\n    جنبش های آزادی خواهی و دموکراسی طلبی اغلب در ایران شکست خورده اند. دموکراسی نیازمند ساختاری ویژه و قانونمند است. قانون باید نوشتار منسجم و بدون ابهام باشد. نمی تواند به صورت گفتار باشد.\n    خشونت سیاسی\n    جوامع دارای فرهنگ گفتاری معمولا بیشتر مستعد خشونت و درگیری سیاسی هستند. ریشه بسیاری از خشونت های سیاسی در ایران در نفهمیدن و نفهماندن بوده است. مطلبی که از بالای یک تریبون فریاد زده شودف بدون آنکه سنجیده یا فهمیده شود باعث بروز حرکت های سیاسی و به تبع آن خشونت و درگیری می شود. در بسیاری از خشونت های سیاسی هر طرف بر موضوع خود پافشاری میکند و بدون درک درستی از مطالب و نظرات مخالف دست به اسلحه می برد. هنگامی که احساسات تحریک می شوند و عقل و منطق از بین می روند چیزی بجز خشونت نمی توان انتظار داشت.\n\n\n\n\n\n\n## نتیجه گیری\nنداشتن فرهنگ نوشتاری یکی از موانع مهم توسعه‌ی اقتصادی و اجتماعی محسوب می‌شود. فرهنگ‌های گفتاری قادر نخواهند بود تمدن‌های بزرگی بسازند و دموکراسی را در جامعه مستقر کنند. یک جامعه پیشرفته به دستورهای دقیق و مدون نیاز دارد. اگر نتوانیم چیزی را به درستی بنویسیم نمی توانیم به روشنی درمورد آن فکر کنیم چون اندیشیدن دقیق بدون نوشتن آن ممکن نیست.\n\n\n## نقد این تئوری\nپدیده‌های اجتماعی یک علتی نیستند به همین خاطر نمی‌توان تنها عامل توسعه نیافتگی ایران را نداشتن فرهنگ نوشتاری دانست. همچنین میتواند رابطه علت و معلول در این مسئله دو طرفه باشد یعنی همه جوامع دارای فرهنگ گفتاری هستند و به تدریج در هر مرحله از توسعه صاحب فرهنگ نوشتاری می‌شوند. (به این ترتیب عدم توسعه هم علت و هم معلول فرهنگ گفتاری است.)\n\n\n\n# نشانه\n\nمحمود سریع القلم: کسی که زبان انگلیسی نمی‌داند نمی تواند منطقی فکر کند.39\n\nجامعه کلنگی فرهنگ کلنگی 46\n\nفریدون هویدا: رهبر در جامعه ای مانند ایران در حکم پدری مستبد است که خود را مجاز می داند تا فرزندانش را به شدت تنبیه کند. 50\n\n\nفاصله‌ی زیاد زبان گفتار و زبان نوشتار در جامعه ایران یکی از علت های بزرگ پایین بودن سرانه‌ی مطالعه است. مثلا اکثر ترجیح می دهند باب یک کارمند بانک صحبت کنند تا اینکه اطلاعات یک قراداد سرمایه گذاری را مطالعه کنند. به دلیل جدایی گفتار و نوشتار چنین می نماید که مردم یران به یک زبان حرف می زنند و به زبانی دیگر می نویسند و می خوانند. این دوگانگی چنان قابل توجه است که زبان نوشتار برای اکثر مردم زبانی بیگانه و عاری از احساس و صمیمیت به نظر می رسد. 68\n\nشعر کلامی دلپذیر و خوشایند است. مورد انتقاد و بحث قرار نمی گیرد. البته شعر هنر بسیار والایی است و استادان شعر فارسی مانند سعدی و رودکی و فردوسی خدمت های بسیاری به فرنگ و تمدن و جامعه ایرانی کرده اند. اما باید در نظر داشت که برخی جنبه های شعر تاثیر مثبتی بر زبانف فرهنگ و جامعه‌ی ایرانی نداشته اند و به جای خردورزی و درست نویسی، ابهام و سردرگمی را رواج داده اند. 74\n\nشبکه های اجتماعی\nکشور های توسه یافته که دارای فرهنگ های نوشتاری منسجمی هستند نخست از مرحله گفتاری به مرحله نوشتاری رسیده اند و پس از آن وارد مرحله‌ی دیجیتالی و مجازی شده اند. در کشورهای توسعه نیافته از جمله ایران که فاقد فرهنگ نوشتاری منسجمی بوده اند به ناگاها از فرهنگ گفتاری سنتی به دنیای عجیب و غریب دیجیتال وارد شده اند. بدین ترتیب تکنولوژی های جدید تاثیر مخربی روی فرهنگ نوشتاری ایران گذاشته اند. باعث شده نوشتار فارسی به زبان محاوره تقلیل یابد.\n\n# حاشیه\n\n## تحلیل کتاب\nاغلب کتاب های جامعه شناسی مفصل و سخت خوان اند و عموم مردم اقبالی به خواندن آن ندارند. اما این کتاب خوشخوان و روان بود. اطاله کلام نداشت مختصر و مفید حرفش را زده بود. (کتاب جامعه شناسی را باید مردم جامعه بخوانند نه فقط جامعه شناس ها)\nبرای اثبات مدعای خود به درستی نمونه ها و مصادیق را جمع آوری کرده بود، تئوری و نظریه ها را مطرح کرده بود و تلاش کرده بود این داده ها را به هم متصل کند تا یک شبکه منسجم از اطلاعات بسازد. در آخر هم به درستی حد و مرز مدعای خود و میزان قابل دفاع بودن آن را مشخص کرده بود. بزرگ نمایی و مبالغه نکرده بود که آهایی ببینید من چه اکتشافی کرده ام.\n آه و افسوس و ناله های بسیار هم سر نداده بود که وای ایران توسعه نیافته و از دست رفته است. مستقیم متهم نکرده بود به اشاره ای مختصر کفایت کرده بود. افسار بحث از دستش خارج نشده بود و حاشیه نمی رفت.\n\nهمانطور که خود نویسنده اشاره کرد این تئوری کامل و جامع نیست و قابل خدشه است. اما به نظرم این گزاره دست کم دو فایده‌ی مهم دارد:\n1. درک بهتر: این تفکیک صورت بندی خوبی در ذهن مان ایجاد می کند. پدیده ها و مصادیق و نمونه های عینی در جامعه را بهتر می توانیم درک کنیم و در ذهنمان دسته بندی کنیم. پدیده ها و اتفاقات اطرافمان را بهتر درک میکنم. می فهمیم چرا این تصمیم گرفته شده، چرا این رفتار شکل گرفته و چرا این واکنش صورت گرفته.\n2. اقدام عملی کوچک و مشخص: با این گزاره برای اصلاح جامعه و رسیدن به توسعه یک اقدام عملی واضح و مشخص داریم. اگر فهرستی از همه عوامل توسعه نیافتگی ایران فراهم کنیم به طوماری میرسیم که حتی حوصله نداریم نگاهش کنیم. اما وقتی یک عامل مشخص داشته باشیم - که از قضا دایره شمولیت آن گسترده باشد - اقدام کردن راحت تر است. میتوانیم با نوشتن زمینه توسعه جامعه خود را فراهم کنیم. میتوانیم از خودمان شروع کنیم. بنویسیم تا شفاف تر فکر کنیم و دقیق تر حرف بزنیم. دیگران را به نوشتن ترغیب کنیم و مثل یک ویروس این به شیوع گسترده آن کمک کنیم و به تدریج گرایش جامعه را به نوشتن سوق دهیم. \n\n- توی متمم هم نوشته بود که وقتی یک مدل ارائه می دهیم برای این است که واقع را بهتر درک کنیم. هیچ وقت ادعای تطابق کامل و جهان شمول بودن نداریم.\n\n\n## نقد\nچرخه علی\nخودزنی\n\n\n## مطالب مرتبط\n\nقانون باید شفاف و واضح باشد. تفسیر پذیر نباشد. یاد [[قلعه حیوانات]] افتادم. قانون با اینکه نوشته شده بود اما همه سواد نداشتند بخوانند. همان قوانین به قدری تغییر کردند که چیزی از آن باقی نماند و دقیقا عکس آن عمل شد و به عنوان قانون معرفی شد.\n\n\nیادداشت [[اثر پذیری مردم از حاکمان یا حاکمان از مردم؟]] | چرخه علی \n\n\n\n\n\n\n> [!NOTE]- می‌نویسم تا برای توسعه‌یافتن ایران قدمی برداشته باشم\n> \n> احتمالا می‌پرسید توسعه‌یافتن ایران چه ربطی به نوشتن دارد؟ من هم چندی پیش اصلا این دو کلمه را در کنار هم ندیده بودم اما حالا ارتباط خاصی بین آن دو می‌بینم و امروز آن را برای شما شرح ‌می‌دهم تا علاوه بر فهمیدن آن، انگیزه‌تان برای نوشتن دوچندان شود.\n> \n> «نوشتن برای توسعه یافتن» ایده‌ای است که بعد از خواندن کتاب «فرهنگ گفتاری» در ذهنم شعله‌ور شد. نویسنده در این کتاب جامعه‌های بشری را به دو دسته‌ی فرهنگ‌ گفتاری و نوشتاری تقسیم می‌کند. در فرهنگ‌های گفتاری برای انتقال مفاهیم معمولا بر گفتار تکیه می‌کنند اما در فرهنگ‌های نوشتاری اغلب از نوشتار استفاده می‌کنند.\n> \n> ادعای نویسنده این است که نداشتن فرهنگ نوشتاری یکی از موانع مهم توسعه‌ی اقتصادی و اجتماعی محسوب می‌شود. فرهنگ‌های گفتاری قادر نخواهند بود تمدن‌های بزرگی بسازند و دموکراسی را در جامعه مستقر کنند. متاسفانه در جامعه‌ی ایران فرهنگ گفتاری غالب است و مردم گرایش کمتری به نوشتن دارند. به همین خاطر یکی از دلایل توسعه نیافتگی ایران نبود فرهنگ نوشتاری است.\n> \n> بین گفتار و نوشتار تفاوت‌های بنیادین وجود دارد. در گفتار معمولا مطالب نامرتب و فاقد دقت هستند. پیام‌ها مبهم و غیرمستقیم‌اند و انتقال مفاهیم به سختی انجام می‌شود. لغزش و خطا در گفتار شایع‌تر است. زبان گفتار از بیان مطالب علمی و پیچیده عاجز است. احساسات و عواطف در گفتار پررنگ‌تر است. در مقابل نوشتار سرد و منطقی است و مفاهیم به صورت منظم و با دقت عرضه می‌شوند. \n> \n> در جوامعی که گفتار بر نوشتار غلبه کند فرهنگ گفتاری شکل می‌گیرد. فرهنگ‌های گفتاری جوامعی سنتی و گذشته‌گرا هستند. به خاطر جبرگرایی، اعتقاد به تقدیر و خرافات گرایش به انقیاد و انفعال دارند. گوینده بیشتر از گفته مورد توجه است. مکالمات با تعارف، کنایه، چاپلوسی، اغراق، تملق و دروغ گویی آمیخته است. قوانین به روشنی نوشته نمی‌شوند و ابهام و تفسیرپذیری مقررات زمینه فساد را فراهم می‌کند. هزینه‌ها اصولا جایی ثبت نمی‌شوند و معاملات شفاهی انجام می‌شوند. سیستم‌های حسابداری و حسابرسی وجود ندارند. آمار و ارقام ثبت نمی‌شوند و گزارشی ارائه نمی‌شود. حفظ کردن و به خاطر سپردن بیشتر از تفکر انتقادی و پرسشگری مورد توجه است. در حالی که فرهنگ‌های نوشتاری نقطه‌ی مقابل این ویژگی‌ها هستند.\n> \n> نویسنده به همین ترتیب به ذکر نمونه‌ها و مصادیقی از پدیده‌های موجود در ایران می‌پردازد تا خواننده را با خود هم‌رأی کند که چطور فرهنگ گفتاری در جامعه، اقتصاد، مدیریت و حکمرانی اثر می‌گذارد و مانع پیشرفت و توسعه می‌شود.\n> \n> البته همانطور که خود نویسنده اشاره می‌کند پدیده‌های اجتماعی تک علتی نیستند و نمی‌توان تنها عامل توسعه نیافتگی ایران را نداشتن فرهنگ نوشتاری معرفی کرد.\n> \n> به هرحال این تئوری با تمام کاستی‌ها و استثناها دست‌کم برای من دو فایده‌ دارد:\n> \n> اول اینکه درک بهتری از اتفاقات اطرافم داشته باشم. این تفکیک به صورت‌بندی پدیده‌ها در ذهنم کمک شایانی می‌کند و می‌توانم آنها را دسته‌بندی کنم. حالا آگاهی کامل‌تری از مشکلات، تصمیمات، واکنش‌ها و رفتارهای خودم یا دیگران دارم و می‌توانم آنها را تحلیل کنم.\n> \n> دوم اینکه یک اقدام عملی کوچک و مشخص داشته باشم. اگر فهرستی از همه عوامل توسعه نیافتگی ایران بنویسیم به طوماری می‌رسیم که حتی حوصله نداریم نگاهش کنیم. اقداماتی که خیلی از آنها خارج از اختیارات ماست. اما با این تئوری من یک وظیفه مشخص دارم که به سادگی قابل انجام است. می‌توانم از خودم شروع کنم. بنویسم تا شفاف‌تر فکر کنم و دقیق‌تر حرف بزنم و با ترغیب دیگران به نوشتن به‌تناوب به توسعه‌ی جامعه کمک کنم.\n> \n> \n> من بعید می‌دانم سیستم فعلی قابل اصلاح باشد. چشم امیدی هم به مداخله‌ی خارجی ندارم. خودمان هستیم که باید برای این فلاکت و بیرون کشیدن ایران از آن چاره‌‌ای بجوییم و اقدامی کنیم.\n> \n> بیایید مرضِ نوشتن را به جان همدیگر بی‌اندازیم و با شیوع گسترده‌ی آن به‌تدریج گرایش جامعه را به نوشتن سوق دهیم. به غلبه‌ی فرهنگ نوشتاری کمک کنیم و زمینه‌ی توسعه و پیشرفت ایران را فراهم کنیم.\n\n\n"},{"id":"notes/اتوپرتره.md","title":"اتوپرتره","path":"notes/اتوپرتره.md","folder":"notes","ext":"md","ctime":1795634259569,"mtime":1795634274352,"size":399,"links":[],"tags":["book"],"properties":{"author":["ادوارد لو"],"pages":92,"rating":4,"date":"2024-07-01T00:00:00.000Z","status":"🟩 Done","cover":"[[atwprtrh.webp]]","tags":["book"],"link":["https://www.goodreads.com/book/show/36422557"],"badge":["🪶خوش‌خوان"],"cover_source":"https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1508160297i/36422557.jpg","genre":["Biography"],"language":"fa"},"computedFormulas":{"starRating":"★★★★","Untitled":""},"coverImage":"assets/images/atwprtrh-jcpn4i.webp","coverAssetRelativePath":"assets/images/atwprtrh-jcpn4i.webp","htmlContent":"","rawMarkdown":"---\nauthor:\n  - ادوارد لو\npages: 92\nrating: 4\ndate: 2024-07-01T00:00:00.000Z\nstatus: 🟩 Done\ncover: \"[[atwprtrh.webp]]\"\ntags:\n  - book\nlink:\n  - https://www.goodreads.com/book/show/36422557\nbadge:\n  - 🪶خوش‌خوان\ncover_source: https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1508160297i/36422557.jpg\ngenre:\n  - Biography\nlanguage: fa\n---\n\n\n\n"},{"id":"notes/یادگیری یادگیری.md","title":"یادگیری یادگیری","path":"notes/یادگیری یادگیری.md","folder":"notes","ext":"md","ctime":1795634173644,"mtime":1795552117498,"size":22418,"links":[],"tags":["book"],"properties":{"author":["Barbara Oakley"],"pages":248,"rating":4.5,"date":"2025-05-01T00:00:00.000Z","status":"✍ To write","cover":"[[yadgyry-yadgyry.webp]]","tags":["book"],"badge":["🪶خوش‌خوان"],"cover_source":"https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1678958674i/123254244.jpg","language":"fa"},"computedFormulas":{"starRating":"★★★★⯨","Untitled":""},"coverImage":"assets/images/yadgyry-yadgyry-hpkjqd.webp","coverAssetRelativePath":"assets/images/yadgyry-yadgyry-hpkjqd.webp","htmlContent":"\u003ch1 data-heading=\"چکیده\" dir=\"auto\">چکیده\u003c/h1>\n\u003ch1 data-heading=\"خلاصه\" dir=\"auto\">خلاصه\u003c/h1>\n\u003ch2 data-heading=\"فصل دوم: حالت متمرکز و غیرمتمرکز\" dir=\"auto\">فصل دوم: حالت متمرکز و غیرمتمرکز\u003c/h2>\n\u003cp dir=\"auto\">\u003cstrong>حالت های متمرکز و غیرمتمرکز:\u003c/strong> مغز به دو حالت عمل می کند:\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">حالت غیرمتمرکز: منظورمان از حالت غیرمتمرکز، بخش‌های خاصی از مغز است که در زمان استراحت و فکر‌نکردن به موضوعی خاص فعال می‌شوند. دانشمندان علم اعصاب به آن شبکه حالت پیش فرض، شبکه ضدکار یا فعال‌ساز حالت‌های استراحت عصبی می‌گویند.\u003c/li>\n\u003cli dir=\"auto\">حالت متمرکز: منظور از حالت متمرکز، بخش‌های خاصی از مغزتان است که هنگام تمرکز زیاد بر یک موضوع فعال هستند. وقتی روی چیزی متمرکز هستید، بخش‌هایی از مغزتان فعال می‌شوند که با بخش‌های فعال در حالت غیرمتمرکز متفاوت‌اند. دانشمندان علم اعصاب به جای حالت متمركز از اصطلاح فعال‌سازی شبکه‌های کارای استفاده می‌کنند.\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cstrong>تغییر حالت:\u003c/strong> برای تغییر حالت، باید تمرکز کنید و به حالت متمرکز بروید. بال های ماشین پین بال را سفت کنید! اما باید اجازه دهید توپ مسیرش را طی کند و منتظر شوید تا در حالت غیرمتمرکز فرود آید. خوابیدن، دوش گرفتن یا صرفا پیاده روی روش هایی هستند که برای رفتن به حالت غیرمتمرکز خوب هستند.\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>برای حل سؤالات موفق باشید اول تمرکز کنید:\u003c/strong> وقتی از اول مغزتان را با تمرکز روی موارد پایه آماده نکرده باشید در حل مسئله مشکل خواهید داشت. قبل از مطالعه توضیحات در حل سؤال غرق نشوید. باید مسیرهای پایهای برای ميزپين بال متمرکز آماده کنید.\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>استراحت کنید تا روش های جدیدی برای حل مسئله پیدا کنید:\u003c/strong> حتی اگر خوب آماده شده باشیم نیز ممکن است در حل یک مسئلة سخت با مشکل مواجه شویم. در این مورد کمی مثل مغنوس شطرنج باز عمل کنید. برای مدتی مسئله را رها کنید و متوجه موارد دیگر باشید. استراحت کنید اما دوباره به مسابقه بروید وگرنه حتما بازی را میبازید!\u003c/p>\n\u003ch2 data-heading=\"فصل سوم: اهمال کاری\" dir=\"auto\">فصل سوم: اهمال کاری\u003c/h2>\n\u003cp dir=\"auto\">همه ما عادت‌هایی داریم که زامبی‌های درون‌مان هستند. عادت‌ها کارهایی هستند که بدون فکر کردن انجام می‌دهیم. عادت‌های زامبی وار ممکن است مفید یا غیرمفید باشند. افراد معمولاً عادت می‌کنند کارها را به تعویق بیندازند، یعنی در واقع اهمال‌کاری می‌کنند. این عادت تأثیر منفی بر یادگیری مؤثر دارد. اهمال‌کاری باعث می‌شود وقت کافی برای تمرکز و غرق شدن در مطالب نداشته باشند.\u003c/p>\n\u003cp dir=\"auto\">خوشبختانه، می‌توانید عادت‌هایتان را تغییر دهید و عادت‌های جدیدتان را ماندگار کنید. تکنیک پومودورو روش خوبی برای کمک به انجام کار متمرکز است. استفاده از این تکنیک را تبدیل به عادت کنید. عوامل حواس‌پرتی را دور کرده و زمان‌سنج را روی ۲۵ دقیقه تنظیم کنید. کار آسانی است. سپس استراحت کنید و به خود پاداش دهید. در زمان استراحت، کاری انجام دهید که کاملاً متفاوت با کار قبل از استراحتتان باشد.\u003c/p>\n\u003ch2 data-heading=\"فصل چهارم: نورون‌ها و پیوند‌های مغزی\" dir=\"auto\">فصل چهارم: نورون‌ها و پیوند‌های مغزی\u003c/h2>\n\u003cp dir=\"auto\">\u003cstrong>آناتومی نورون\u003c/strong>\u003cbr>\n\u003cstrong>نورون‌ها\u003c/strong> سلول‌های کوچکی هستند که بلوک‌های سازندۀ مغز به شمار می‌آیند. تعداد آنها بسیار زیاد است. آنها خیلی کوچک اند. عرض ده نورون تقریبا برابر با عرض موی انسان است. نورون‌ها سیگنال‌های الکتریکی می‌فرستند که در مغز حرکت می‌کنند؛ افکار ما توسط همین سیگنال ها شکل میگیرد.\u003c/p>\n\u003cp dir=\"auto\">نورون‌ها شکل خاصی دارند آنها چند \u003cstrong>دندریت\u003c/strong> در یک طرف خود و یک \u003cstrong>آکسون\u003c/strong> در طرف دیگر دارند. میتوان آن را به یک موجود فضایی تشبیه کرد که یک دست (آکسون) و چند پا (دندریت) دارد. خارهای دندریتی مانند انگشتان پا روی پاهای نورون هستند.\u003c/p>\n\u003cp dir=\"auto\">نورون‌ها به یکدیگر \u003cstrong>سیگنال\u003c/strong> می‌فرستند. یک نورون از طریق آکسون یک شوک به خار دندریتی نورون دیگر وارد میکند که مانند الکتریسته ساکن است. یک نورون از طریق شکافی باریک و کوچک به نورون دیگر شوک میفرستد که به این شکاف \u003cstrong>سیناپش\u003c/strong> می‌گویند.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"image-1.webp\" alt=\"image-1.webp\" width=\"400\">“image-1.webp” could not be found.\u003c/span>\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"image-2.webp\" alt=\"image-2.webp\" width=\"400\">“image-2.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>زنجیره نورون‌ها\u003c/strong>\u003cbr>\nنورون‌هایی که به یکدیگر شلیک میکنند، به هم متصل می شوند و مجموعه ای از پیوند‌های مغزی می‌سازند. وقتی برای اولین بار چیزی را یاد می‌گیرید پیوند‌های مغزی ضعیف هستند. اما وقتی مفهومی را تمرین میکنید نورون‌های بیشتری به پیوند اضافه می‌شوند و پیوند‌های سیناپسی قوی‌تر می‌شود.\u003c/p>\n\u003cp dir=\"auto\">\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"image-3.webp\" alt=\"image-3.webp\" width=\"400\">“image-3.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">میتوان این پیوند های مغزی را به مسیری تشبیه کرد که یک موشی در جنگل طی میکند. هر چه موش دفعات بیشتری مسیر را طی کند مسیر تمیزتر و عریض تر میشود. هر چه مسیر عریض تر باشد راحت تر میتوان مسیر را دید و دنبال کرد.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1749236959150.webp\" alt=\"1749236959150.webp\">“1749236959150.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>استعاره ابزار یادگیری\u003c/strong>\u003cbr>\nاستعاره‌ها کمک می‌کنند آنچه را بلدید به مفاهیمی دیگر که دارید یادمی‌گیرید متصل کنید. وقتی به یک استعاره فکر می‌کنید، مسیرِ یک مفهوم واقعی فعال می‌شود. این مسیری که در مغزتان فعال می‌شود، کمک می‌کند بتوانید به یک مفهوم واقعى پيجيده فكر كنيد. استفاده از استعاره فرایند درک و یادگیری را سریع‌تر می‌کند.\u003c/p>\n\u003ch2 data-heading=\"فصل 5\" dir=\"auto\">فصل 5\u003c/h2>\n\u003cp dir=\"auto\">چیزی نداشت.\u003c/p>\n\u003ch2 data-heading=\"فصل 6: یادگیری در خواب\" dir=\"auto\">فصل 6: یادگیری در خواب\u003c/h2>\n\u003cp dir=\"auto\">وقتی شروع به یادگیری موضوعی می‌کنید، سینایس‌ها و خارهای دندریتی جدید شکل‌گیری را آغاز می‌کنند. ولی هنگام خواب و بعد از یادگیری متمرکز است که سیناپس‌ها و خارهای دندریتی واقعاً رشد می‌کنند.\u003c/p>\n\u003cp dir=\"auto\">خواب ملاتی فراهم می‌کند که موجب استحکام دیوار یادگیری می‌شود.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"image-5.webp\" alt=\"image-5.webp\">“image-5.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">وقتی به تمرین مطالب آموخته‌شده جدید ادامه می‌دهید، سینایس‌ها و خارهاى دندريتى بیش از پیش رشد می‌کنند. هر چقدر فکری را در مسیرهای نورونی بیشتر ارسال کنید، ماندگارتر خواهد شد. مجموعه پیوندهای مغزی به این شیوه ساخته می‌شوند.\u003c/p>\n\u003cp dir=\"auto\">شب امتحانی درس نخوانید. یادگیری یک موضوع بهتر است با فاصله زمانی در چند روز رخ دهد. در این صورت، خواب شبانه بیشتری در طول یادگیری دارید که باعث رشد سینایس‌ها و خارهای دندریتی بیشتر شده و مطالب حدیث در ذهنتان تثبیت می‌شود.\u003c/p>\n\u003cp dir=\"auto\">ما با سرعت‌های متفاوتی یاد می‌گیریم. اگر فرد دیگری از شما سریعتر است، اصلاً احساس بدی نداشته باشید. زندگی هم این است. فقط کمی بیشتر وقت بگذارید. به زودی خواهید دید که «کند یادگیری» می‌تواند مزایای ویژه‌ای داشته باشد.\u003c/p>\n\u003ch2 data-heading=\"فصل 7: حافظه فعال و بلند مدت، اختاپوس\" dir=\"auto\">فصل 7: حافظه فعال و بلند مدت، اختاپوس\u003c/h2>\n\u003cp dir=\"auto\">شما دو سیستم حافظه دارید: حافظۀ فعال و حافظۀ بلندمدت. حافظه فعال شامل هر چیزی است که در لحظه هشیارانه به آن فکر می‌کنید. سیستم حافظۀ فعال عمدتاً در قشر جلوی پیشانی قرار دارد. می‌توانید تصور کنید که حافظه فعال شما یک اختایوس ذهنی کوچک است که معمولاً چهار بازو دارد. داشتن چهار بازو دلیل توانایی محدود حافظه فعال در حفظ اطلاعات را توضیح می‌دهد.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"image-6.webp\" alt=\"image-6.webp\" width=\"400\">“image-6.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">بازوان اختاپوسی ممکن است لیز باشند و در نتیجه اطلاعات از روی آنها لیز بخورند و بیفتند. به همین خاطر است که برای حفظ کردن موقتاً اطلاعات، آنها را چندین بار تکرار می‌کنیم. مثلاً برای اسامی می‌کویم: «یلدا، یلدا، یلدا». برای شماره‌ها نیز خرید نیز کار مشابهی انجام می‌دهیم. با این کار به اختاپوس ذهنی کمک می‌کنیم که اطلاعات را نگاه دارد. شاید حداقل تا زمان نوشتن اطلاعات این کار را انجام دهیم. (در واقع، نوشتن یکی از راه‌های کمک به اختاپوس برای نگهداشتن اطلاعات است!)\u003c/p>\n\u003cp dir=\"auto\">حافظه بلندمدت در کل مغز گسترده شده است. با استفاده از بازوان اختاپوس ذهنی خود، می‌توانید به آن دسترسی داشته باشید. حافظة بلندمدت فضاى ذخیره تقریباً بی‌عیب و نقص است، اما لازم است با تمرین کنترل بیشتری بر آن داشته باشید.\u003c/p>\n\u003ch2 data-heading=\"فصل 8: تکنیک های تقویت حافظه\" dir=\"auto\">فصل 8: تکنیک های تقویت حافظه\u003c/h2>\n\u003cp dir=\"auto\">اطلاعات در حافظه به دو صورت ذخیره می‌شود: داده‌ها و تصاویر. حفظ کردن و یادآوری تصاویر بسیار راحت‌تر است.\u003c/p>\n\u003cp dir=\"auto\">برای کمک به حفظ اطلاعات از این روش ها استفاده کنید:\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>تکنیک تصویر سازی\u003c/strong>\u003cbr>\nموضوع مدنظر خود را به تصویر تبدیل کنید. اطلاعات را به جک های تصویری مسخره تبدیل کنید. وقتی چیزی را به روش مضحک حفظ کنید یادآوری آن راحت تر است.\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>به کارگیری استعاره\u003c/strong>\u003cbr>\nبرای اطلاعاتی که میخواهید یاد بگیرید استعاره بسازید. به تشابهات اطلاعات جدید و قبلی فکر کنید. \u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>تکنیک قصر حافظه\u003c/strong>\u003cbr>\nمکانی مثل خانه خودتان را مجسم کنید که به خوبی میشناسید. سپس چیزهایی را که قرار است یاد بگیرید در نظرگرفته و همینطور كه در تصورتان در خانه راه مى رويد، آنها را در جاهاى مختلف خانه قرار دهيد. سعى كنيد تصویری عجیب و احمقانه در مورد هركدام از موارد ليست مجسم كنيد. کمی هم تحرک به آنها بیفزایید. سپس تصور کنید که در خانه راه میروید و مشاهدەشان میکنید، حتی میتوانید با آنها حرف بزنید.\u003cbr>\nچرا این روش جواب می‌دهد؟ این تکنیک باستانی جواب می‌دهد؛ زیرا مغز در به‌خاطر آوردن مکان‌ها و مسیرها عملکرد خیلی خوبی دارد. همه اینها بخشی از قسمت «تصاویر» حافظه بلندمدت است که دانشمندان آن را حافظه دیداری-فضایی می‌گویند. برخی افراد به تمرین بیشتری برای کسب توانایی در این مهارت نیاز دارند، ولی به هر حال پتانسیل آن در همه وجود دارد.\u003cbr>\nاین بخش از مغز مکان‌ها و مسیرها را خیلی بهتر از چند داده تصادفی به خاطر می‌آورد. اگر به زندگی یک انسان عصر سنگی فکر کنید، لازم بود مسیرها را به یاد داشته باشد. مسیریابی برای او خیلی ضروری‌تر از نامگذاری سنگ‌ها بود. چه اهمیتی داشت که مثلاً اسم فلان سنگ «کوارتز» باشد؟ مهم این بود که غارش کجاست.\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>برای تثبیت اطلاعات از یادآوری فعال استفاده کنید.\u003c/strong>\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>دانش خود را به دیگری آموزش دهید.\u003c/strong>\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>یادداشت برداری کنید.\u003c/strong>\u003c/p>\n\u003ch2 data-heading=\"فصل 9: پیوندهای مغزی\" dir=\"auto\">فصل 9: پیوندهای مغزی\u003c/h2>\n\u003cp dir=\"auto\">وقتی برای اولین بار می‌خواهید چیزی را بفهمید، حافظه فعالتان بسیار درگیر است. هر چهار بازوی اختاپوس ذهنی مشغول انتقال اطلاعات مختلف هستند و سعی می‌کنند ایده‌ها را طوری کنار هم بچینند که به هم مربوط بوده و ارتباطشان معنادار باشد. حافظه فعال سعی می‌کند مجموعه جدیدی از پیوندهای مغزی بسازد. در واقع سیناپس‌ها و خارهای دندریتی به نورونهای دیگر پیوند می زند.\u003c/p>\n\u003cp dir=\"auto\">\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1747937163153.webp\" alt=\"1747937163153.webp\">“1747937163153.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">حافظه بلند مدت شما از همین مجموعه پیوندها ساخته می شود. حافظه فعال در هر لحظه اطلاعات محدودی را پردازش میکند. این مجموعه پیوند ها به حافظه فعال کمک می کنند اطلاعات را بسیار سریعتر پردازش کند. اگر اطلاعات به خوبی پیوند خورده باشند اختاپوس می تواند یک پیوند مغزی پر از اطلاعات را به یکباره جذب و به حافظه فعال منتقل کند.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1749237206135.webp\" alt=\"1749237206135.webp\" width=\"400\">“1749237206135.webp” could not be found.\u003c/span>\u003cbr>\nدر واقع این کار را فقط با یک بازو انجام می دهد و سه بازوی دیگر فعال هستند. با آنها می توانید فکر کنید یا مجموعه پیوند های دیگر را به حافظه فعال بیاورید. به این ترتیب میتوانید فعالیت های پیچیده تری انجام داده و ایده ها را ترکیب کنید.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1749235675264.webp\" alt=\"1749235675264.webp\" width=\"400\">“1749235675264.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">اگر قرار باشد اختاپوس مدام بین موضوعات مختلف دررفت وآمد باشد، زود خسته میشود. سعی کنید از حواس پرتی و جابه جایی بین کارها اجتناب کنید.\u003c/p>\n\u003cp dir=\"auto\">اغلب اولین مراحل یادگیری یک مفهوم یا کار جدید سختترین مراحل هستند. صبور باشید و به تلاشتان ادامه دهید. تمرین کنید تا در نهایت از ایجاد یک مجموعه از پیوندهای مغزی و درک موضوع لذت ببرید.\u003c/p>\n\u003ch2 data-heading=\"فصل 10: یادگیری با گروه\" dir=\"auto\">فصل 10: یادگیری با گروه\u003c/h2>\n\u003cp dir=\"auto\">چیزی نداشت.\u003c/p>\n\u003ch2 data-heading=\"فصل 11: تقویت مغز، ورزش\" dir=\"auto\">فصل 11: تقویت مغز، ورزش\u003c/h2>\n\u003cp dir=\"auto\">ورزش براى نورونها، بهويزه نورون هاى جديد، خيلى مفيد است. ورزش به تولید یک مادە شیمیایی بهنام بی.دی.ان.اف كمك می كند كه نقشى شبیه غذای مغز دارد. ورزش به رهاشدن موادی شیمیایی دربدن کمک میکند که باعث\u003cbr>\nتولید ایدەهای جدید میشوند. ورزش یک فعالساز عالی برای حالت غیرمتمرکز است!\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1747938187361.webp\" alt=\"1747938187361.webp\" width=\"400\">“1747938187361.webp” could not be found.\u003c/span>\u003c/p>\n\u003ch2 data-heading=\"فصل 12: ساختن پیوند مغزی\" dir=\"auto\">فصل 12: ساختن پیوند مغزی\u003c/h2>\n\u003cp dir=\"auto\">نگاه کردن به راه حل یا مشاهده تمرین دیکران می تواند شروع فرایند یادگیری باشد ولی تأثیر چندانی در ساخت پیوندهای مغزی ندارد. کارکردن فعالانه روی یک مسئله یا انجام فعالیتی فعالانه است که منجر به ایجاد پیوندهای مغزى می شود.\u003c/p>\n\u003cp dir=\"auto\">می توانید با تمرین هدفمند پیوندهای مغزى را ایجاد یا تقویت کنید. تمرین هدفمند تکرار تمرین بخش های مشکل تریک مفهوم است. وقت زیادی به مطالب آسان تر که بر آنها مسلط هستید اختصاص ندهید.\u003c/p>\n\u003cp dir=\"auto\">اگر تمرین نکنید پیوند ها کمرنگ می شوند.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1747942541397.webp\" alt=\"1747942541397.webp\" width=\"300\">“1747942541397.webp” could not be found.\u003c/span>\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>یادآوری فعال\u003c/strong> را تمرین کنید. از خودتان امتحان بکیرید یا از دیگری بخواهید از شما بیارد.\u003c/p>\n\u003cp dir=\"auto\">تدريس یکی از بهترین روش های تقویت پیوندهای مغزى و تشخیص شکاف های دانش خود است.\u003c/p>\n\u003ch2 data-heading=\"فصل 13:\" dir=\"auto\">فصل 13:\u003c/h2>\n\u003cp dir=\"auto\">هر زمان که ممکن بود در مکان های مختلفی مطالعه کنید. با این کار، اختاپوس ذهنی می تواند به راحتی اطلاعات مربوطه را پیدا کند.\u003c/p>\n\u003cp dir=\"auto\">سعی کنید از حس های مختلف در یادگیری استفاده کنید. چشم، گوش، دست و حتی بینی می توانند در یادگیری به شما کمک کنند. وقتی از حس های بیشتر استفاده کنید، یادگیری بهتر خواهد داشت.\u003c/p>\n\u003cp dir=\"auto\">خواب نه فقط به ساختن اتصالات سیناپسی کمک می کند، بلکه سموم را نیز پاکسازی می کند.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1747942801066.webp\" alt=\"1747942801066.webp\" width=\"300\">“1747942801066.webp” could not be found.\u003c/span>\u003cbr>\nقورباغه را اول قورت بدهید. در ابتدا با مطالب مشکل تر شروع کنید تا بتوانید استراحت کرده و در صورت لزوم از حالت غیرمتمرکز خود استفاده کنید.\u003c/p>\n\u003cp dir=\"auto\">هر زمان که ممکن بود یک زمان پایان قطعی برای کارهای خود تعیین کنید تا به این ترتیب هنگام انجام کارها تمرکز بهتر کنید.\u003c/p>\n\u003ch2 data-heading=\"فصل 14:\" dir=\"auto\">فصل 14:\u003c/h2>\n\u003cp dir=\"auto\">برای افزایش انعطاف‌پذیری، چیز کاملاً متفاوت یاد بگیرید. پیوندهایی خواهید دید که منجر به خلاقیت و کمک به رابطه اصلی‌تان می‌شود. همچنین، یادگیری یک دانش کاملاً متفاوت می‌تواند از «تفکر ثابت» جلوگیری کند.\u003c/p>\n\u003ch2 data-heading=\"فصل 15\" dir=\"auto\">فصل 15\u003c/h2>\n\u003cp dir=\"auto\">از تکنیک استفاده کنید که شروع سخت باشد. اگر برای آزمون خوب مطالعه کرده‌اید، آزمون را با یک سؤال سخت شروع کنید. اگر در حل آن مشکل داشتید، دست بکشید و سراغ حل سوال آسان بروید. بعداً در طول آزمون، باز می‌توانید به همان سؤال سخت برگردید و به حل آن فکر کنید. با این روش، امکان پیشروی شما در حل سؤال سخت بیشتر از وقتی است که تا انتهای آزمون به حل آن نریزید.\u003cbr>\n\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1747943074452.webp\" alt=\"1747943074452.webp\" width=\"300\">“1747943074452.webp” could not be found.\u003c/span>\u003c/p>\n\u003ch2 data-heading=\"فصل 16\" dir=\"auto\">فصل 16\u003c/h2>\n\u003cp dir=\"auto\">\u003cspan class=\"internal-embed is-loaded file-embed mod-empty-attachment\" src=\"1747943145940.webp\" alt=\"1747943145940.webp\" width=\"500\">“1747943145940.webp” could not be found.\u003c/span>\u003c/p>\n\u003ch1 data-heading=\"نشانه\" dir=\"auto\">نشانه\u003c/h1>\n\u003ch1 data-heading=\"حاشیه\" dir=\"auto\">حاشیه\u003c/h1>\n\u003cp dir=\"auto\">کتاب خوش‌خوانی بود. موجز و مختصر بدون لفاظی و اطاله کلام. تصویر سازی های بامزه که به فهم مطلب کمک میکردند. جمع بندی و تمرینات آخر فصل. در واقع همون توصیه هایی که خود نویسنده برای یادگیری کرده بود خودش یک نمونه اش رو در کتاب اجرا کرده بود. \u003c/p>\n\u003ch2 data-heading=\"جمع بندی\" dir=\"auto\">جمع بندی\u003c/h2>\n\u003cp dir=\"auto\">برای تقویت حافظه\u003c/p>\n\u003cp dir=\"auto\">\u003cstrong>اقدامات فیزیکی\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">خواب\u003c/li>\n\u003cli dir=\"auto\">ورزش\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cstrong>روش های مادام العمر\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">تصویر سازی: تبدیل داده به تصویر\u003c/li>\n\u003cli dir=\"auto\">استعاره\u003c/li>\n\u003cli dir=\"auto\">یادآوری فعال\u003c/li>\n\u003cli dir=\"auto\">توضیح به دیگری\u003c/li>\n\u003cli dir=\"auto\">یادداشت برداری\u003c/li>\n\u003cli dir=\"auto\">پیوند زدن و تمرین کردن برای ساختن پازل\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cstrong>روش های کنکوری\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">قصر حافظه\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cstrong>توصیه های دیگه\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">یادگیری در مکان های مختلف\u003c/li>\n\u003cli dir=\"auto\">استفاده از همه سبک ها شنیداری، دیداری و...\u003c/li>\n\u003cli dir=\"auto\">یادگرفتن چیز متفاوت\u003c/li>\n\u003cli dir=\"auto\">استفاده از حالت غیر متمرکز، تکنیک شروع سخت\u003c/li>\n\u003c/ul>\n\u003cp dir=\"auto\">\u003cstrong>نکته\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli dir=\"auto\">\n\u003cp>چرا میگیم یادگیری کریستالی؟ چرا میگیم تفکر غیر خطیه؟ چرا میگیم لینک دهی کنید؟ چرا تاکید میکنیم رو اینا. چون مغز اینطوری یاد میگیره. چون نورون ها اینطوری به هم گره میخورن و افکار ما شکل میگیره.\u003c/p>\n\u003c/li>\n\u003cli dir=\"auto\">\n\u003cp>بحث حوصله سر رفتن با حالت غیر متمرکز کتاب یادگیری یادگیری:\u003cbr>\nکتاب در ستایش بطالت\u003cbr>\n\u003ca href=\"https://motamem.org/%d8%a7%d9%88%d9%82%d8%a7%d8%aa-%d9%81%d8%b1%d8%a7%d8%ba%d8%aa/\" title=\"Permalink to اوقات فراغت | آیا باید به دنبال پر کردن اوقات فراغت باشیم؟\" class=\"external-link\" rel=\"noopener nofollow\" aria-label=\"https://motamem.org/%d8%a7%d9%88%d9%82%d8%a7%d8%aa-%d9%81%d8%b1%d8%a7%d8%ba%d8%aa/\" data-tooltip-position=\"top\" target=\"_blank\">اوقات فراغت | آیا باید به دنبال پر کردن اوقات فراغت باشیم؟\u003c/a>\u003c/p>\n\u003c/li>\n\u003c/ul>","rawMarkdown":"---\nauthor:\n  - Barbara Oakley\npages: 248\nrating: 4.5\ndate: 2025-05-01T00:00:00.000Z\nstatus: ✍ To write\ncover: \"[[yadgyry-yadgyry.webp]]\"\ntags:\n  - book\nbadge:\n  - 🪶خوش‌خوان\ncover_source: https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1678958674i/123254244.jpg\nlanguage: fa\n---\n\n# چکیده\n\n\n# خلاصه\n\n## فصل دوم: حالت متمرکز و غیرمتمرکز\n\n**حالت های متمرکز و غیرمتمرکز:** مغز به دو حالت عمل می کند:\n- حالت غیرمتمرکز: منظورمان از حالت غیرمتمرکز، بخش‌های خاصی از مغز است که در زمان استراحت و فکر‌نکردن به موضوعی خاص فعال می‌شوند. دانشمندان علم اعصاب به آن شبکه حالت پیش فرض، شبکه ضدکار یا فعال‌ساز حالت‌های استراحت عصبی می‌گویند.\n- حالت متمرکز: منظور از حالت متمرکز، بخش‌های خاصی از مغزتان است که هنگام تمرکز زیاد بر یک موضوع فعال هستند. وقتی روی چیزی متمرکز هستید، بخش‌هایی از مغزتان فعال می‌شوند که با بخش‌های فعال در حالت غیرمتمرکز متفاوت‌اند. دانشمندان علم اعصاب به جای حالت متمركز از اصطلاح فعال‌سازی شبکه‌های کارای استفاده می‌کنند.\n\n**تغییر حالت:** برای تغییر حالت، باید تمرکز کنید و به حالت متمرکز بروید. بال های ماشین پین بال را سفت کنید! اما باید اجازه دهید توپ مسیرش را طی کند و منتظر شوید تا در حالت غیرمتمرکز فرود آید. خوابیدن، دوش گرفتن یا صرفا پیاده روی روش هایی هستند که برای رفتن به حالت غیرمتمرکز خوب هستند.\n\n**برای حل سؤالات موفق باشید اول تمرکز کنید:** وقتی از اول مغزتان را با تمرکز روی موارد پایه آماده نکرده باشید در حل مسئله مشکل خواهید داشت. قبل از مطالعه توضیحات در حل سؤال غرق نشوید. باید مسیرهای پایهای برای ميزپين بال متمرکز آماده کنید.\n\n**استراحت کنید تا روش های جدیدی برای حل مسئله پیدا کنید:** حتی اگر خوب آماده شده باشیم نیز ممکن است در حل یک مسئلة سخت با مشکل مواجه شویم. در این مورد کمی مثل مغنوس شطرنج باز عمل کنید. برای مدتی مسئله را رها کنید و متوجه موارد دیگر باشید. استراحت کنید اما دوباره به مسابقه بروید وگرنه حتما بازی را میبازید!\n\n## فصل سوم: اهمال کاری\nهمه ما عادت‌هایی داریم که زامبی‌های درون‌مان هستند. عادت‌ها کارهایی هستند که بدون فکر کردن انجام می‌دهیم. عادت‌های زامبی وار ممکن است مفید یا غیرمفید باشند. افراد معمولاً عادت می‌کنند کارها را به تعویق بیندازند، یعنی در واقع اهمال‌کاری می‌کنند. این عادت تأثیر منفی بر یادگیری مؤثر دارد. اهمال‌کاری باعث می‌شود وقت کافی برای تمرکز و غرق شدن در مطالب نداشته باشند.\n\nخوشبختانه، می‌توانید عادت‌هایتان را تغییر دهید و عادت‌های جدیدتان را ماندگار کنید. تکنیک پومودورو روش خوبی برای کمک به انجام کار متمرکز است. استفاده از این تکنیک را تبدیل به عادت کنید. عوامل حواس‌پرتی را دور کرده و زمان‌سنج را روی ۲۵ دقیقه تنظیم کنید. کار آسانی است. سپس استراحت کنید و به خود پاداش دهید. در زمان استراحت، کاری انجام دهید که کاملاً متفاوت با کار قبل از استراحتتان باشد.\n\n## فصل چهارم: نورون‌ها و پیوند‌های مغزی\n\n**آناتومی نورون**\n**نورون‌ها** سلول‌های کوچکی هستند که بلوک‌های سازندۀ مغز به شمار می‌آیند. تعداد آنها بسیار زیاد است. آنها خیلی کوچک اند. عرض ده نورون تقریبا برابر با عرض موی انسان است. نورون‌ها سیگنال‌های الکتریکی می‌فرستند که در مغز حرکت می‌کنند؛ افکار ما توسط همین سیگنال ها شکل میگیرد.\n\nنورون‌ها شکل خاصی دارند آنها چند **دندریت** در یک طرف خود و یک **آکسون** در طرف دیگر دارند. میتوان آن را به یک موجود فضایی تشبیه کرد که یک دست (آکسون) و چند پا (دندریت) دارد. خارهای دندریتی مانند انگشتان پا روی پاهای نورون هستند.\n\n\nنورون‌ها به یکدیگر **سیگنال** می‌فرستند. یک نورون از طریق آکسون یک شوک به خار دندریتی نورون دیگر وارد میکند که مانند الکتریسته ساکن است. یک نورون از طریق شکافی باریک و کوچک به نورون دیگر شوک میفرستد که به این شکاف **سیناپش** می‌گویند. \n![[image-1.webp|400]]\n![[image-2.webp|400]]\n\n\n**زنجیره نورون‌ها**\nنورون‌هایی که به یکدیگر شلیک میکنند، به هم متصل می شوند و مجموعه ای از پیوند‌های مغزی می‌سازند. وقتی برای اولین بار چیزی را یاد می‌گیرید پیوند‌های مغزی ضعیف هستند. اما وقتی مفهومی را تمرین میکنید نورون‌های بیشتری به پیوند اضافه می‌شوند و پیوند‌های سیناپسی قوی‌تر می‌شود.\n\n![[image-3.webp|400]]\n\nمیتوان این پیوند های مغزی را به مسیری تشبیه کرد که یک موشی در جنگل طی میکند. هر چه موش دفعات بیشتری مسیر را طی کند مسیر تمیزتر و عریض تر میشود. هر چه مسیر عریض تر باشد راحت تر میتوان مسیر را دید و دنبال کرد.\n![[1749236959150.webp]]\n\n\n\n\n**استعاره ابزار یادگیری**\nاستعاره‌ها کمک می‌کنند آنچه را بلدید به مفاهیمی دیگر که دارید یادمی‌گیرید متصل کنید. وقتی به یک استعاره فکر می‌کنید، مسیرِ یک مفهوم واقعی فعال می‌شود. این مسیری که در مغزتان فعال می‌شود، کمک می‌کند بتوانید به یک مفهوم واقعى پيجيده فكر كنيد. استفاده از استعاره فرایند درک و یادگیری را سریع‌تر می‌کند.\n\n\n## فصل 5\nچیزی نداشت.\n\n## فصل 6: یادگیری در خواب\n\nوقتی شروع به یادگیری موضوعی می‌کنید، سینایس‌ها و خارهای دندریتی جدید شکل‌گیری را آغاز می‌کنند. ولی هنگام خواب و بعد از یادگیری متمرکز است که سیناپس‌ها و خارهای دندریتی واقعاً رشد می‌کنند.\n\nخواب ملاتی فراهم می‌کند که موجب استحکام دیوار یادگیری می‌شود.\n![[image-5.webp]]\n\nوقتی به تمرین مطالب آموخته‌شده جدید ادامه می‌دهید، سینایس‌ها و خارهاى دندريتى بیش از پیش رشد می‌کنند. هر چقدر فکری را در مسیرهای نورونی بیشتر ارسال کنید، ماندگارتر خواهد شد. مجموعه پیوندهای مغزی به این شیوه ساخته می‌شوند.\n\nشب امتحانی درس نخوانید. یادگیری یک موضوع بهتر است با فاصله زمانی در چند روز رخ دهد. در این صورت، خواب شبانه بیشتری در طول یادگیری دارید که باعث رشد سینایس‌ها و خارهای دندریتی بیشتر شده و مطالب حدیث در ذهنتان تثبیت می‌شود.\n\nما با سرعت‌های متفاوتی یاد می‌گیریم. اگر فرد دیگری از شما سریعتر است، اصلاً احساس بدی نداشته باشید. زندگی هم این است. فقط کمی بیشتر وقت بگذارید. به زودی خواهید دید که «کند یادگیری» می‌تواند مزایای ویژه‌ای داشته باشد.\n\n## فصل 7: حافظه فعال و بلند مدت، اختاپوس\n\n\nشما دو سیستم حافظه دارید: حافظۀ فعال و حافظۀ بلندمدت. حافظه فعال شامل هر چیزی است که در لحظه هشیارانه به آن فکر می‌کنید. سیستم حافظۀ فعال عمدتاً در قشر جلوی پیشانی قرار دارد. می‌توانید تصور کنید که حافظه فعال شما یک اختایوس ذهنی کوچک است که معمولاً چهار بازو دارد. داشتن چهار بازو دلیل توانایی محدود حافظه فعال در حفظ اطلاعات را توضیح می‌دهد.\n![[image-6.webp|400]]\n\nبازوان اختاپوسی ممکن است لیز باشند و در نتیجه اطلاعات از روی آنها لیز بخورند و بیفتند. به همین خاطر است که برای حفظ کردن موقتاً اطلاعات، آنها را چندین بار تکرار می‌کنیم. مثلاً برای اسامی می‌کویم: «یلدا، یلدا، یلدا». برای شماره‌ها نیز خرید نیز کار مشابهی انجام می‌دهیم. با این کار به اختاپوس ذهنی کمک می‌کنیم که اطلاعات را نگاه دارد. شاید حداقل تا زمان نوشتن اطلاعات این کار را انجام دهیم. (در واقع، نوشتن یکی از راه‌های کمک به اختاپوس برای نگهداشتن اطلاعات است!)\n\nحافظه بلندمدت در کل مغز گسترده شده است. با استفاده از بازوان اختاپوس ذهنی خود، می‌توانید به آن دسترسی داشته باشید. حافظة بلندمدت فضاى ذخیره تقریباً بی‌عیب و نقص است، اما لازم است با تمرین کنترل بیشتری بر آن داشته باشید.\n\n## فصل 8: تکنیک های تقویت حافظه\nاطلاعات در حافظه به دو صورت ذخیره می‌شود: داده‌ها و تصاویر. حفظ کردن و یادآوری تصاویر بسیار راحت‌تر است.\n\nبرای کمک به حفظ اطلاعات از این روش ها استفاده کنید:\n\n**تکنیک تصویر سازی**\nموضوع مدنظر خود را به تصویر تبدیل کنید. اطلاعات را به جک های تصویری مسخره تبدیل کنید. وقتی چیزی را به روش مضحک حفظ کنید یادآوری آن راحت تر است.\n\n**به کارگیری استعاره**\nبرای اطلاعاتی که میخواهید یاد بگیرید استعاره بسازید. به تشابهات اطلاعات جدید و قبلی فکر کنید. \n\n**تکنیک قصر حافظه**\nمکانی مثل خانه خودتان را مجسم کنید که به خوبی میشناسید. سپس چیزهایی را که قرار است یاد بگیرید در نظرگرفته و همینطور كه در تصورتان در خانه راه مى رويد، آنها را در جاهاى مختلف خانه قرار دهيد. سعى كنيد تصویری عجیب و احمقانه در مورد هركدام از موارد ليست مجسم كنيد. کمی هم تحرک به آنها بیفزایید. سپس تصور کنید که در خانه راه میروید و مشاهدەشان میکنید، حتی میتوانید با آنها حرف بزنید.\nچرا این روش جواب می‌دهد؟ این تکنیک باستانی جواب می‌دهد؛ زیرا مغز در به‌خاطر آوردن مکان‌ها و مسیرها عملکرد خیلی خوبی دارد. همه اینها بخشی از قسمت «تصاویر» حافظه بلندمدت است که دانشمندان آن را حافظه دیداری-فضایی می‌گویند. برخی افراد به تمرین بیشتری برای کسب توانایی در این مهارت نیاز دارند، ولی به هر حال پتانسیل آن در همه وجود دارد.\nاین بخش از مغز مکان‌ها و مسیرها را خیلی بهتر از چند داده تصادفی به خاطر می‌آورد. اگر به زندگی یک انسان عصر سنگی فکر کنید، لازم بود مسیرها را به یاد داشته باشد. مسیریابی برای او خیلی ضروری‌تر از نامگذاری سنگ‌ها بود. چه اهمیتی داشت که مثلاً اسم فلان سنگ «کوارتز» باشد؟ مهم این بود که غارش کجاست.\n\n**برای تثبیت اطلاعات از یادآوری فعال استفاده کنید.**\n\n**دانش خود را به دیگری آموزش دهید.**\n\n**یادداشت برداری کنید.**\n\n## فصل 9: پیوندهای مغزی\n\nوقتی برای اولین بار می‌خواهید چیزی را بفهمید، حافظه فعالتان بسیار درگیر است. هر چهار بازوی اختاپوس ذهنی مشغول انتقال اطلاعات مختلف هستند و سعی می‌کنند ایده‌ها را طوری کنار هم بچینند که به هم مربوط بوده و ارتباطشان معنادار باشد. حافظه فعال سعی می‌کند مجموعه جدیدی از پیوندهای مغزی بسازد. در واقع سیناپس‌ها و خارهای دندریتی به نورونهای دیگر پیوند می زند.\n\n![[1747937163153.webp]]\n\nحافظه بلند مدت شما از همین مجموعه پیوندها ساخته می شود. حافظه فعال در هر لحظه اطلاعات محدودی را پردازش میکند. این مجموعه پیوند ها به حافظه فعال کمک می کنند اطلاعات را بسیار سریعتر پردازش کند. اگر اطلاعات به خوبی پیوند خورده باشند اختاپوس می تواند یک پیوند مغزی پر از اطلاعات را به یکباره جذب و به حافظه فعال منتقل کند. \n![[1749237206135.webp|400]]\nدر واقع این کار را فقط با یک بازو انجام می دهد و سه بازوی دیگر فعال هستند. با آنها می توانید فکر کنید یا مجموعه پیوند های دیگر را به حافظه فعال بیاورید. به این ترتیب میتوانید فعالیت های پیچیده تری انجام داده و ایده ها را ترکیب کنید.\n![[1749235675264.webp|400]]\n\n\n\n\n\nاگر قرار باشد اختاپوس مدام بین موضوعات مختلف دررفت وآمد باشد، زود خسته میشود. سعی کنید از حواس پرتی و جابه جایی بین کارها اجتناب کنید.\n\n\nاغلب اولین مراحل یادگیری یک مفهوم یا کار جدید سختترین مراحل هستند. صبور باشید و به تلاشتان ادامه دهید. تمرین کنید تا در نهایت از ایجاد یک مجموعه از پیوندهای مغزی و درک موضوع لذت ببرید.\n\n\n## فصل 10: یادگیری با گروه\nچیزی نداشت.\n\n## فصل 11: تقویت مغز، ورزش\n\nورزش براى نورونها، بهويزه نورون هاى جديد، خيلى مفيد است. ورزش به تولید یک مادە شیمیایی بهنام بی.دی.ان.اف كمك می كند كه نقشى شبیه غذای مغز دارد. ورزش به رهاشدن موادی شیمیایی دربدن کمک میکند که باعث\nتولید ایدەهای جدید میشوند. ورزش یک فعالساز عالی برای حالت غیرمتمرکز است!\n![[1747938187361.webp|400]]\n\n## فصل 12: ساختن پیوند مغزی\n\nنگاه کردن به راه حل یا مشاهده تمرین دیکران می تواند شروع فرایند یادگیری باشد ولی تأثیر چندانی در ساخت پیوندهای مغزی ندارد. کارکردن فعالانه روی یک مسئله یا انجام فعالیتی فعالانه است که منجر به ایجاد پیوندهای مغزى می شود.\n\nمی توانید با تمرین هدفمند پیوندهای مغزى را ایجاد یا تقویت کنید. تمرین هدفمند تکرار تمرین بخش های مشکل تریک مفهوم است. وقت زیادی به مطالب آسان تر که بر آنها مسلط هستید اختصاص ندهید.\n\nاگر تمرین نکنید پیوند ها کمرنگ می شوند.\n![[1747942541397.webp|300]]\n\n\n\n**یادآوری فعال** را تمرین کنید. از خودتان امتحان بکیرید یا از دیگری بخواهید از شما بیارد.\n\nتدريس یکی از بهترین روش های تقویت پیوندهای مغزى و تشخیص شکاف های دانش خود است.\n## فصل 13: \n\nهر زمان که ممکن بود در مکان های مختلفی مطالعه کنید. با این کار، اختاپوس ذهنی می تواند به راحتی اطلاعات مربوطه را پیدا کند.\n\nسعی کنید از حس های مختلف در یادگیری استفاده کنید. چشم، گوش، دست و حتی بینی می توانند در یادگیری به شما کمک کنند. وقتی از حس های بیشتر استفاده کنید، یادگیری بهتر خواهد داشت.\n\nخواب نه فقط به ساختن اتصالات سیناپسی کمک می کند، بلکه سموم را نیز پاکسازی می کند.\n![[1747942801066.webp| 300]]\nقورباغه را اول قورت بدهید. در ابتدا با مطالب مشکل تر شروع کنید تا بتوانید استراحت کرده و در صورت لزوم از حالت غیرمتمرکز خود استفاده کنید.\n\nهر زمان که ممکن بود یک زمان پایان قطعی برای کارهای خود تعیین کنید تا به این ترتیب هنگام انجام کارها تمرکز بهتر کنید.\n\n## فصل 14:\nبرای افزایش انعطاف‌پذیری، چیز کاملاً متفاوت یاد بگیرید. پیوندهایی خواهید دید که منجر به خلاقیت و کمک به رابطه اصلی‌تان می‌شود. همچنین، یادگیری یک دانش کاملاً متفاوت می‌تواند از «تفکر ثابت» جلوگیری کند.\n\n## فصل 15\nاز تکنیک استفاده کنید که شروع سخت باشد. اگر برای آزمون خوب مطالعه کرده‌اید، آزمون را با یک سؤال سخت شروع کنید. اگر در حل آن مشکل داشتید، دست بکشید و سراغ حل سوال آسان بروید. بعداً در طول آزمون، باز می‌توانید به همان سؤال سخت برگردید و به حل آن فکر کنید. با این روش، امکان پیشروی شما در حل سؤال سخت بیشتر از وقتی است که تا انتهای آزمون به حل آن نریزید.\n![[1747943074452.webp|300]]\n## فصل 16\n![[1747943145940.webp| 500]]\n\n# نشانه\n\n\n# حاشیه\n\nکتاب خوش‌خوانی بود. موجز و مختصر بدون لفاظی و اطاله کلام. تصویر سازی های بامزه که به فهم مطلب کمک میکردند. جمع بندی و تمرینات آخر فصل. در واقع همون توصیه هایی که خود نویسنده برای یادگیری کرده بود خودش یک نمونه اش رو در کتاب اجرا کرده بود. \n\n\n\n\n## جمع بندی\n\nبرای تقویت حافظه\n\n**اقدامات فیزیکی**\n- خواب\n- ورزش\n\n**روش های مادام العمر**\n- تصویر سازی: تبدیل داده به تصویر\n- استعاره\n- یادآوری فعال\n- توضیح به دیگری\n- یادداشت برداری\n- پیوند زدن و تمرین کردن برای ساختن پازل\n\n\n\n\n**روش های کنکوری**\n- قصر حافظه\n\n\n**توصیه های دیگه**\n- یادگیری در مکان های مختلف\n- استفاده از همه سبک ها شنیداری، دیداری و...\n- یادگرفتن چیز متفاوت\n- استفاده از حالت غیر متمرکز، تکنیک شروع سخت\n\n\n**نکته**\n- چرا میگیم یادگیری کریستالی؟ چرا میگیم تفکر غیر خطیه؟ چرا میگیم لینک دهی کنید؟ چرا تاکید میکنیم رو اینا. چون مغز اینطوری یاد میگیره. چون نورون ها اینطوری به هم گره میخورن و افکار ما شکل میگیره.\n\n- بحث حوصله سر رفتن با حالت غیر متمرکز کتاب یادگیری یادگیری:\n   کتاب در ستایش بطالت\n   [اوقات فراغت | آیا باید به دنبال پر کردن اوقات فراغت باشیم؟](https://motamem.org/%d8%a7%d9%88%d9%82%d8%a7%d8%aa-%d9%81%d8%b1%d8%a7%d8%ba%d8%aa/ \"Permalink to اوقات فراغت | آیا باید به دنبال پر کردن اوقات فراغت باشیم؟\")\n"},{"id":"notes/مجموعه آثار چخوف (جلد چهارم).md","title":"مجموعه آثار چخوف (جلد چهارم)","path":"notes/مجموعه آثار چخوف (جلد چهارم).md","folder":"notes","ext":"md","ctime":1795634110901,"mtime":1795552117497,"size":481,"links":[],"tags":["book"],"properties":{"author":"آنتوان چخوف","translator":"سروژ استپانیان","pages":672,"rating":3.5,"date":"2026-04-08T00:00:00.000Z","status":"🟩 Done","cover":"[[mjmwah-aathar-chkhwf-jld-chharm.webp]]","tags":["book"],"badge":null,"genre":null,"cover_source":"https://img.taaghche.com/frontCover/137227.jpg","type":"Short Story","language":"fa"},"computedFormulas":{"starRating":"★★★⯨","Untitled":""},"coverImage":"assets/images/mjmwah-aathar-chkhwf-jld-chharm-uetd63.webp","coverAssetRelativePath":"assets/images/mjmwah-aathar-chkhwf-jld-chharm-uetd63.webp","htmlContent":"\u003ch1 data-heading=\"چکیده\" dir=\"auto\">چکیده\u003c/h1>\n\u003ch1 data-heading=\"خلاصه\" dir=\"auto\">خلاصه\u003c/h1>\n\u003ch1 data-heading=\"نشانه\" dir=\"auto\">نشانه\u003c/h1>\n\u003ch1 data-heading=\"حاشیه\" dir=\"auto\">حاشیه\u003c/h1>\n\u003cp dir=\"auto\">بهترین داستان های این جلد:\u003cbr>\nاتاق شماره 6\u003cbr>\nویولن روتشیلد\u003c/p>","rawMarkdown":"---\nauthor: آنتوان چخوف\ntranslator: سروژ استپانیان\npages: 672\nrating: 3.5\ndate: 2026-04-08T00:00:00.000Z\nstatus: 🟩 Done\ncover: \"[[mjmwah-aathar-chkhwf-jld-chharm.webp]]\"\ntags:\n  - book\nbadge:\ngenre:\ncover_source: https://img.taaghche.com/frontCov
