e-handbook.webp]]\"\ntags:\n  - book\naliases:\n  - کتاب راهنمای اسکچ نوت\nbadge:\n  - 🦉آموزنده\ncover_source: https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1354312096i/15858089.jpg\nlanguage: en\n---\n\n\n"},{"id":"notes/The PARA Method Simplify, Organize, and Master Your Digital Life.md","title":"The PARA Method Simplify, Organize, and Master Your Digital Life","path":"notes/The PARA Method Simplify, Organize, and Master Your Digital Life.md","folder":"notes","tags":["book"],"properties":{"author":"Tiago Forte","pages":203,"rating":3,"date":"2025-09-10","status":null,"cover":"[[para-method.webp]]","tags":["book"],"badge":["🪶خوش‌خوان"],"cover_source":"https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1683399809i/134634583.jpg","language":"en"},"computedFormulas":{"starRating":"★★★","Untitled":""},"coverImage":"assets/images/para-method-vq5zt8.webp","coverAssetRelativePath":"assets/images/para-method-vq5zt8.webp","htmlContent":"\u003cp dir=\"auto\">The system you use to organize information has to be so simple that it frees up your attention, instead of taking more of it. Your system must give you time, not take time. (25)\u003c/p>\n\u003chr>\n\u003cp dir=\"auto\">So much of what we call “organizing” is essentially procrastination in disguise. We tell ourselves we’re “getting ready” or “doing research,” pretending like that means progress. (37)\u003c/p>\n\u003chr>\n\u003cp dir=\"auto\">The Era of the Wisdom Worker\u003cbr>\nFor decades, we’ve called ourselves “knowledge workers” based on the fact that knowledge was our main asset. More than sixty years after that term was coined, the era of the knowledge worker is finally coming to a close. Knowledge has been commoditized and made universally accessible, first through search engines and now through increasingly advanced artificial intelligence. Which means there is no advantage to knowing any particular piece of knowledge anymore. We are now entering the era of the Wisdom Worker. (147)\u003c/p>","rawMarkdown":"---\nauthor: Tiago Forte\npages: 203\nrating: 3\ndate: 2025-09-10\nstatus:\ncover: \"[[para-method.webp]]\"\ntags:\n  - book\nbadge:\n  - 🪶خوش‌خوان\ncover_source: https://images-na.ssl-images-amazon.com/images/S/compressed.photo.goodreads.com/books/1683399809i/134634583.jpg\nlanguage: en\n---\n\nThe system you use to organize information has to be so simple that it frees up your attention, instead of taking more of it. Your system must give you time, not take time. (25)\n\n---\n\nSo much of what we call “organizing” is essentially procrastination in disguise. We tell ourselves we’re “getting ready” or “doing research,” pretending like that means progress. (37)\n\n\n\n---\n\nThe Era of the Wisdom Worker \nFor decades, we’ve called ourselves “knowledge workers” based on the fact that knowledge was our main asset. More than sixty years after that term was coined, the era of the knowledge worker is finally coming to a close. Knowledge has been commoditized and made universally accessible, first through search engines and now through increasingly advanced artificial intelligence. Which means there is no advantage to knowing any particular piece of knowledge anymore. We are now entering the era of the Wisdom Worker. (147)\n"},{"id":"notes/The Phantom of the Opera.md","title":"The Phantom of the Opera","path":"notes/The Phantom of the Opera.md","folder":"notes","tags":["book"],"properties":{"author":["Jennifer Bassett"],"translator":null,"pages":64,"source":"https://www.goodreads.com/book/show/2974076","cover":"[[The Phantom of the Opera.webp]]","cover_source":"https://m.media-amazon.com/images/S/compressed.photo.goodreads.com/books/1352395155i/2974076.jpg","date":"2026-07-10","tags":["book"],"badge":["🌀مرموز"],"rating":4,"genre":null,"status":null,"type":"Novel","publisher":"Oxford","language":"en"},"computedFormulas":{"starRating":"★★★★","Untitled":""},"coverImage":"assets/images/The Phantom of the Op
